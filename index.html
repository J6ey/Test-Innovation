<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejeweled</title>
<style>
  :root {
    --bg-dark: #0f0c29;
    --board-bg: #1a1533;
    --tile-size: 60px;
    --gap: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #2b2350, #0f0c29 70%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #f0eaff;
    padding: 20px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 2.2rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd700, #ff6ec7, #6ecbff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  .subtitle {
    opacity: 0.7;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  .hud .label {
    opacity: 0.6;
    font-size: 0.75rem;
    display: block;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .hud .value {
    font-weight: bold;
    font-size: 1.4rem;
  }

  #board {
    position: relative;
    background: var(--board-bg);
    padding: var(--gap);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
    touch-action: none;
  }

  .tile {
    position: absolute;
    top: var(--gap);
    left: var(--gap);
    width: var(--tile-size);
    height: var(--tile-size);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--tile-size) * 0.55);
    cursor: grab;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
    transition: transform 0.26s cubic-bezier(0.34, 1.2, 0.4, 1), opacity 0.26s ease, filter 0.2s ease, box-shadow 0.15s ease;
    will-change: transform;
  }

  .tile:hover {
    filter: brightness(1.12);
  }

  .tile.selected {
    box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(255,255,255,0.7);
    filter: brightness(1.15);
  }

  .tile.invalid {
    animation: invalidFlash 0.3s ease;
  }

  @keyframes invalidFlash {
    0%, 100% { filter: none; }
    50% { filter: brightness(1.9) saturate(2) hue-rotate(-20deg); }
  }

  .tile.pending {
    box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.85), 0 0 14px 4px rgba(255, 215, 0, 0.5),
      inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
    animation: pendingPulse 0.5s ease-in-out infinite;
  }

  @keyframes pendingPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .tile.special {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 0 16px 5px rgba(255,255,255,0.55),
      inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
    animation: specialPulse 1.2s ease-in-out infinite;
  }

  .tile.special.bomb::after {
    content: '✦';
    position: absolute;
    top: 1px;
    right: 4px;
    font-size: 0.9rem;
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,0.9);
    pointer-events: none;
  }

  @keyframes specialPulse {
    0%, 100% { filter: brightness(1) saturate(1.1); }
    50% { filter: brightness(1.55) saturate(1.7); }
  }

  .tile.special.wildcard {
    background: conic-gradient(from 0deg, #ff6ec7, #ffd700, #6ecbff, #7cff6e, #ff6ec7);
    animation: wildcardShimmer 2.4s linear infinite, specialPulse 1.2s ease-in-out infinite;
  }

  @keyframes wildcardShimmer {
    from { filter: hue-rotate(0deg) brightness(1.05); }
    to { filter: hue-rotate(360deg) brightness(1.05); }
  }

  .tile.special.cross {
    background: radial-gradient(circle, #ffffff 0%, #9fe3ff 55%, #4aa8ff 100%);
  }

  .tile.special.cross::after {
    content: '✚';
    position: absolute;
    top: 1px;
    right: 4px;
    font-size: 0.9rem;
    color: #063a5e;
    text-shadow: 0 0 6px rgba(255,255,255,0.9);
    pointer-events: none;
  }

  .beam {
    position: absolute;
    pointer-events: none;
    z-index: 6;
    border-radius: 4px;
    box-shadow: 0 0 24px 6px rgba(180,230,255,0.8);
    transform-origin: center;
  }

  .beam-h {
    height: 8px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95) 15%, rgba(140,220,255,0.9) 50%, rgba(255,255,255,0.95) 85%, transparent);
    animation: beamSweepH 0.45s ease-out forwards;
  }

  .beam-v {
    width: 8px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.95) 15%, rgba(140,220,255,0.9) 50%, rgba(255,255,255,0.95) 85%, transparent);
    animation: beamSweepV 0.45s ease-out forwards;
  }

  @keyframes beamSweepH {
    0% { transform: scaleX(0); opacity: 1; }
    70% { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(1); opacity: 0; }
  }

  @keyframes beamSweepV {
    0% { transform: scaleY(0); opacity: 1; }
    70% { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); opacity: 0; }
  }

  .tile.zapped {
    animation: zapFlash 0.3s ease;
  }

  @keyframes zapFlash {
    0% { filter: brightness(1) saturate(1); }
    35% { filter: brightness(2.3) saturate(2.6) hue-rotate(60deg); }
    100% { filter: brightness(1) saturate(1); }
  }

  .shockwave {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transform: scale(0.15);
    opacity: 1;
    animation-name: shockwaveAnim;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    z-index: 5;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,190,80,0.65) 30%, rgba(255,100,60,0.25) 55%, transparent 75%);
    box-shadow: 0 0 40px 10px rgba(255,180,80,0.55);
  }

  .shockwave.rainbow {
    background: conic-gradient(from 0deg, #ff6ec7, #ffd700, #6ecbff, #7cff6e, #ff6ec7);
    opacity: 0.5;
    mix-blend-mode: screen;
    box-shadow: 0 0 60px 16px rgba(255,255,255,0.35);
  }

  @keyframes shockwaveAnim {
    0% { transform: scale(0.1); opacity: 1; }
    60% { opacity: 0.75; }
    100% { transform: scale(1); opacity: 0; }
  }

  #message {
    margin-top: 14px;
    min-height: 24px;
    font-size: 1rem;
    opacity: 0.85;
  }

  #controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }

  button {
    background: linear-gradient(135deg, #6ecbff, #ff6ec7);
    border: none;
    color: #10082a;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
  }

  button:hover {
    filter: brightness(1.1);
  }

  button:active {
    transform: translateY(1px);
  }

  #settings {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  #settings label {
    font-size: 0.8rem;
    opacity: 0.75;
    letter-spacing: 0.3px;
  }

  #settings label span {
    opacity: 1;
    font-weight: bold;
    color: #ffd700;
  }

  #settings input[type="range"] {
    width: 220px;
    accent-color: #ff6ec7;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>💎 BEJEWELED 💎</h1>
  <div class="subtitle">Match 4 for a blast gem, 5 in a line for a wildcard, or an L/T/+ shape for a cross gem</div>

  <div class="hud">
    <div>
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div>
      <span class="label">Moves</span>
      <span class="value" id="moves">0</span>
    </div>
    <div>
      <span class="label">Best</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div id="board"></div>
  <div id="message"></div>

  <div id="controls">
    <button id="restart">New Game</button>
    <button id="shuffle">Shuffle</button>
    <button id="muteBtn" aria-label="Toggle sound">🔊</button>
  </div>

  <div id="settings">
    <label for="swapSpeed">Swap delay: <span id="swapSpeedValue">280ms</span></label>
    <input type="range" id="swapSpeed" min="100" max="900" step="10" value="280">
  </div>

<script>
(function () {
  const SIZE = 8;
  const GEMS = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣'];
  const TILE = 60;
  const GAP = 6;
  const CELL = TILE + GAP;
  let SWAP_MS = 280;
  const MATCH_MS = 300;
  const CONVERGE_MS = 380;
  const EXPLODE_MS = 500;
  const FALL_MS = 320;
  const SWIPE_THRESHOLD = 18;
  const WILDCARD_STAGGER_MS = 35;
  const WILDCARD_FADE_MS = 280;

  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restart');
  const shuffleBtn = document.getElementById('shuffle');
  const swapSpeedInput = document.getElementById('swapSpeed');
  const swapSpeedValue = document.getElementById('swapSpeedValue');
  const muteBtn = document.getElementById('muteBtn');

  // box-sizing: border-box means #board's own padding eats into the size we
  // set here, so the board box must also account for that padding (2x GAP) on
  // top of the space the tiles themselves need — otherwise the last row/column
  // is clipped by the board's overflow:hidden.
  const boardSize = SIZE * TILE + (SIZE + 1) * GAP;
  board.style.width = boardSize + 'px';
  board.style.height = boardSize + 'px';

  const GRACE_MS = 650;
  const GRACE_POLL_MS = 50;

  let grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  let score = 0;
  let moves = 0;
  let best = Number(localStorage.getItem('bejeweled-best') || 0);
  let selected = null;
  let nextId = 0;
  const pointerStates = new Map();
  // Multiple swaps can be in flight at once (each tile only blocks itself via
  // tile.busy). Once a swap is confirmed as a match it's handed to this queue
  // so the actual clear+gravity animations never run concurrently and stomp
  // on each other's board state.
  let resolveQueue = [];
  let resolveQueueBusy = false;

  bestEl.textContent = best;

  function randomGem() {
    return Math.floor(Math.random() * GEMS.length);
  }

  function sleep(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  // ---- sound (synthesized with Web Audio, no audio files needed) ----

  let soundEnabled = localStorage.getItem('bejeweled-sound') !== 'off';
  let audioCtx = null;

  function getAudioCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone({ freq, freqEnd, duration, type = 'sine', gain = 0.18, delay = 0 }) {
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const start = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), start + duration);
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  function playNoise({ duration, gain = 0.2, delay = 0, filterFreq = 1200 }) {
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const start = ctx.currentTime + delay;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    noise.connect(filter).connect(g).connect(ctx.destination);
    noise.start(start);
    noise.stop(start + duration + 0.02);
  }

  const sfx = {
    swap() {
      playTone({ freq: 380, freqEnd: 520, duration: 0.09, type: 'sine', gain: 0.1 });
    },
    invalid() {
      playTone({ freq: 180, freqEnd: 110, duration: 0.16, type: 'square', gain: 0.09 });
    },
    match(chain) {
      playTone({ freq: 500 + Math.min(chain, 6) * 50, freqEnd: 800, duration: 0.16, type: 'triangle', gain: 0.15 });
    },
    special() {
      playTone({ freq: 320, freqEnd: 980, duration: 0.32, type: 'sawtooth', gain: 0.12 });
      playTone({ freq: 640, freqEnd: 1400, duration: 0.28, type: 'sine', gain: 0.08, delay: 0.05 });
    },
    bomb() {
      playNoise({ duration: 0.35, gain: 0.28, filterFreq: 700 });
      playTone({ freq: 110, freqEnd: 35, duration: 0.35, type: 'sine', gain: 0.22 });
    },
    cross() {
      playNoise({ duration: 0.4, gain: 0.2, filterFreq: 2600 });
      playTone({ freq: 700, freqEnd: 1600, duration: 0.4, type: 'sine', gain: 0.12 });
    },
    wildcardZap() {
      playTone({ freq: 220, freqEnd: 1300, duration: 0.5, type: 'sawtooth', gain: 0.14 });
      playNoise({ duration: 0.3, gain: 0.1, filterFreq: 3500, delay: 0.05 });
    },
    reshuffle() {
      playTone({ freq: 260, freqEnd: 340, duration: 0.22, type: 'sine', gain: 0.1 });
    },
  };

  // ---- pure matching helpers (operate on plain 2D arrays of gem indices) ----

  // Returns both the flattened set of matched cells and the individual runs
  // (needed to tell 4-in-a-row runs apart so they can spawn a special gem).
  function findMatchesDetailed(g) {
    const runs = [];

    for (let r = 0; r < SIZE; r++) {
      let runStart = 0;
      for (let c = 1; c <= SIZE; c++) {
        const same = c < SIZE && g[r][c] !== null && g[r][c] === g[r][runStart];
        if (!same) {
          if (c - runStart >= 3) {
            const run = [];
            for (let k = runStart; k < c; k++) run.push({ r, c: k });
            runs.push(run);
          }
          runStart = c;
        }
      }
    }

    for (let c = 0; c < SIZE; c++) {
      let runStart = 0;
      for (let r = 1; r <= SIZE; r++) {
        const same = r < SIZE && g[r][c] !== null && g[r][c] === g[runStart][c];
        if (!same) {
          if (r - runStart >= 3) {
            const run = [];
            for (let k = runStart; k < r; k++) run.push({ r: k, c });
            runs.push(run);
          }
          runStart = r;
        }
      }
    }

    const cellSet = new Set();
    for (const run of runs) {
      for (const cell of run) cellSet.add(`${cell.r},${cell.c}`);
    }
    const cells = [...cellSet].map(key => {
      const [r, c] = key.split(',').map(Number);
      return { r, c };
    });

    return { cells, runs };
  }

  function findMatches(g) {
    return findMatchesDetailed(g).cells;
  }

  // Detects intersecting horizontal+vertical runs (L, T, or + shapes) whose
  // combined size is 5 or more — these spawn a cross gem instead of two
  // separate line specials.
  function findCrossGroups(runs) {
    const horizontals = runs.filter(run => run.length >= 3 && run[0].r === run[run.length - 1].r);
    const verticals = runs.filter(run => run.length >= 3 && run[0].c === run[run.length - 1].c);
    const groups = [];
    for (const hRun of horizontals) {
      const hRow = hRun[0].r;
      for (const vRun of verticals) {
        const vCol = vRun[0].c;
        const intersects = hRun.some(cell => cell.c === vCol) && vRun.some(cell => cell.r === hRow);
        if (!intersects) continue;
        if (hRun.length + vRun.length - 1 < 5) continue;
        groups.push({ hRun, vRun, intersection: { r: hRow, c: vCol } });
      }
    }
    return groups;
  }

  function dedupeCells(cells) {
    const seen = new Set();
    const result = [];
    for (const cell of cells) {
      const key = cellKey(cell.r, cell.c);
      if (seen.has(key)) continue;
      seen.add(key);
      result.push(cell);
    }
    return result;
  }

  function hasPossibleMove(g) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r][c + 1];
          clone[r][c + 1] = tmp;
          if (findMatches(clone).length > 0) return true;
        }
        if (r < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r + 1][c];
          clone[r + 1][c] = tmp;
          if (findMatches(clone).length > 0) return true;
        }
      }
    }
    return false;
  }

  function genLayout() {
    let g;
    do {
      g = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          let gem;
          do {
            gem = randomGem();
          } while (
            (c >= 2 && row[c - 1] === gem && row[c - 2] === gem) ||
            (r >= 2 && g[r - 1][c] === gem && g[r - 2][c] === gem)
          );
          row.push(gem);
        }
        g.push(row);
      }
    } while (findMatches(g).length === 0 && !hasPossibleMove(g));
    return g;
  }

  function snapshotGrid() {
    return grid.map(row => row.map(t => (t ? t.gem : null)));
  }

  // ---- tile objects + animated positioning ----

  function setPos(tile, r, c, instant) {
    tile.r = r;
    tile.c = c;
    const x = c * CELL;
    const y = r * CELL;
    if (instant) tile.el.style.transition = 'none';
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(${tile.scale})`;
    if (instant) {
      tile.el.offsetHeight;
      tile.el.style.transition = '';
    }
  }

  function setScale(tile, scale) {
    tile.scale = scale;
    const x = tile.c * CELL;
    const y = tile.r * CELL;
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    tile.el.style.opacity = String(scale);
  }

  function createTile(r, c, gem) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.textContent = GEMS[gem];
    el.addEventListener('pointerdown', onPointerDown);
    el.addEventListener('pointermove', onPointerMove);
    el.addEventListener('pointerup', onPointerUp);
    el.addEventListener('pointercancel', onPointerCancel);
    board.appendChild(el);
    const tile = { id: nextId++, gem, r, c, el, scale: 1, special: null, busy: false };
    el._tile = tile;
    setPos(tile, r, c, true);
    return tile;
  }

  // type: 'bomb' (4-match, blasts a 3x3 area when cleared), 'wildcard'
  // (5-in-a-line, zaps every gem of a color when swiped), or 'cross' (L/T/+
  // shaped match, clears its whole row+column when cleared).
  function markSpecial(tile, type) {
    tile.special = type;
    tile.el.classList.add('special', type);
    if (type === 'wildcard') tile.el.textContent = '🌟';
    const x = tile.c * CELL;
    const y = tile.r * CELL;
    tile.el.style.transitionDuration = '';
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(1.4)`;
    setTimeout(() => {
      tile.el.style.transform = `translate(${x}px, ${y}px) scale(1)`;
    }, 220);
  }

  function cellCenterPx(r, c) {
    return { x: GAP + c * CELL + TILE / 2, y: GAP + r * CELL + TILE / 2 };
  }

  // Animates a matched tile flying toward the cell where a new special gem is
  // forming, shrinking and fading as it merges in. Used for every non-spawn
  // cell in a run/group that's about to become a bomb, wildcard, or cross gem.
  function convergeTile(tile, targetR, targetC) {
    const x = targetC * CELL;
    const y = targetR * CELL;
    tile.scale = 0;
    tile.el.style.transitionDuration = CONVERGE_MS + 'ms';
    tile.el.style.transitionTimingFunction = 'cubic-bezier(0.4, 0, 0.7, 1)';
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(0.15)`;
    tile.el.style.opacity = '0';
  }

  // Two beams sweeping the full row and column a cross gem is on.
  function spawnCrossBeams(origin) {
    const p = cellCenterPx(origin.r, origin.c);

    const hBeam = document.createElement('div');
    hBeam.className = 'beam beam-h';
    hBeam.style.top = (p.y - 4) + 'px';
    hBeam.style.left = '0px';
    hBeam.style.width = boardSize + 'px';
    board.appendChild(hBeam);
    hBeam.addEventListener('animationend', () => hBeam.remove());

    const vBeam = document.createElement('div');
    vBeam.className = 'beam beam-v';
    vBeam.style.left = (p.x - 4) + 'px';
    vBeam.style.top = '0px';
    vBeam.style.height = boardSize + 'px';
    board.appendChild(vBeam);
    vBeam.addEventListener('animationend', () => vBeam.remove());
  }

  function spawnShockwave(cx, cy, opts) {
    const wave = document.createElement('div');
    wave.className = 'shockwave' + (opts.rainbow ? ' rainbow' : '');
    const size = opts.size;
    wave.style.left = cx + 'px';
    wave.style.top = cy + 'px';
    wave.style.width = size + 'px';
    wave.style.height = size + 'px';
    wave.style.marginLeft = (-size / 2) + 'px';
    wave.style.marginTop = (-size / 2) + 'px';
    wave.style.animationDuration = (opts.durationMs || 550) + 'ms';
    board.appendChild(wave);
    wave.addEventListener('animationend', () => wave.remove());
  }

  // Shatters a tile outward with a random fling + spin, used for bomb-blast cells.
  function explodeTile(tile) {
    const baseX = tile.c * CELL;
    const baseY = tile.r * CELL;
    const flingX = (Math.random() * 2 - 1) * 26;
    const flingY = (Math.random() * 2 - 1) * 26;
    const rot = (Math.random() * 2 - 1) * 100;
    tile.el.style.transition = `transform ${EXPLODE_MS}ms cubic-bezier(0.2, 0.8, 0.3, 1), opacity ${EXPLODE_MS}ms ease`;
    tile.el.style.transform = `translate(${baseX + flingX}px, ${baseY + flingY}px) scale(0) rotate(${rot}deg)`;
    tile.el.style.opacity = '0';
  }

  // Expands a set of "r,c" cell keys to include the blast radius of any special
  // gem caught inside it — a 3x3 area for a bomb, the full row+column for a
  // cross gem — chaining into further specials the blast reaches.
  function expandSpecialChain(toClear) {
    const bombOrigins = [];
    const crossOrigins = [];
    const blastCells = new Set();
    const processedSpecials = new Set();
    let expanded = true;
    while (expanded) {
      expanded = false;
      for (const key of [...toClear]) {
        const { r, c } = parseCellKey(key);
        const tile = grid[r][c];
        if (!tile || !tile.special || processedSpecials.has(tile.id)) continue;

        if (tile.special === 'bomb') {
          processedSpecials.add(tile.id);
          bombOrigins.push({ r, c });
          blastCells.add(key);
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr;
              const nc = c + dc;
              if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
              const nKey = cellKey(nr, nc);
              blastCells.add(nKey);
              if (!toClear.has(nKey)) {
                toClear.add(nKey);
                expanded = true;
              }
            }
          }
        } else if (tile.special === 'cross') {
          processedSpecials.add(tile.id);
          crossOrigins.push({ r, c });
          blastCells.add(key);
          for (let cc = 0; cc < SIZE; cc++) {
            const nKey = cellKey(r, cc);
            blastCells.add(nKey);
            if (!toClear.has(nKey)) {
              toClear.add(nKey);
              expanded = true;
            }
          }
          for (let rr = 0; rr < SIZE; rr++) {
            const nKey = cellKey(rr, c);
            blastCells.add(nKey);
            if (!toClear.has(nKey)) {
              toClear.add(nKey);
              expanded = true;
            }
          }
        }
      }
    }
    return { bombOrigins, crossOrigins, blastCells, processedSpecials };
  }

  function clearBoard() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) grid[r][c] = null;
    }
    board.innerHTML = '';
  }

  function buildBoardFromLayout(layout) {
    clearBoard();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        grid[r][c] = createTile(r, c, layout[r][c]);
      }
    }
  }

  // ---- selection + input (click/tap and swipe/drag share attemptSwap) ----

  function selectTile(r, c) {
    selected = { r, c };
    grid[r][c].el.classList.add('selected');
  }

  function clearSelection() {
    if (selected) {
      const t = grid[selected.r][selected.c];
      if (t) t.el.classList.remove('selected');
    }
    selected = null;
  }

  function handleTap(r, c) {
    const tapped = grid[r][c];
    if (!tapped || tapped.busy) return;
    if (!selected) {
      selectTile(r, c);
      return;
    }
    if (selected.r === r && selected.c === c) {
      clearSelection();
      return;
    }
    const isAdjacent =
      (Math.abs(selected.r - r) === 1 && selected.c === c) ||
      (Math.abs(selected.c - c) === 1 && selected.r === r);
    if (!isAdjacent) {
      clearSelection();
      selectTile(r, c);
      return;
    }
    const from = selected;
    clearSelection();
    attemptSwap(from, { r, c });
  }

  function onPointerDown(e) {
    if (soundEnabled) getAudioCtx(); // unlock audio on the earliest possible gesture
    const tile = e.currentTarget._tile;
    if (tile.busy) return;
    // Keyed by pointerId so multiple fingers (or overlapping gestures) can each
    // be mid-swipe at the same time without clobbering each other's tracking.
    pointerStates.set(e.pointerId, {
      r: tile.r,
      c: tile.c,
      startX: e.clientX,
      startY: e.clientY,
      moved: false,
    });
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {
      // pointer may no longer be active (rapid tap/touch edge cases) — safe to ignore
    }
  }

  function onPointerMove(e) {
    const state = pointerStates.get(e.pointerId);
    if (!state || state.moved) return;
    const dx = e.clientX - state.startX;
    const dy = e.clientY - state.startY;
    if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;

    state.moved = true;
    let targetR = state.r;
    let targetC = state.c;
    if (Math.abs(dx) > Math.abs(dy)) {
      targetC += dx > 0 ? 1 : -1;
    } else {
      targetR += dy > 0 ? 1 : -1;
    }

    const from = { r: state.r, c: state.c };
    clearSelection();
    if (targetR >= 0 && targetR < SIZE && targetC >= 0 && targetC < SIZE) {
      attemptSwap(from, { r: targetR, c: targetC });
    }
  }

  function onPointerUp(e) {
    const state = pointerStates.get(e.pointerId);
    pointerStates.delete(e.pointerId);
    if (!state) return;
    if (!state.moved) handleTap(state.r, state.c);
  }

  function onPointerCancel(e) {
    pointerStates.delete(e.pointerId);
  }

  // ---- swap / match / gravity ----

  // The swap animation gets an explicit duration (tied to the adjustable
  // SWAP_MS) instead of the CSS default, so the slider only affects swaps —
  // gravity falls and match fades keep their own fixed timing. Callers reset
  // transitionDuration back to '' once the swap-specific animation is done.
  function doSwap(a, b) {
    const tileA = grid[a.r][a.c];
    const tileB = grid[b.r][b.c];
    grid[a.r][a.c] = tileB;
    grid[b.r][b.c] = tileA;
    tileA.el.style.transitionDuration = SWAP_MS + 'ms';
    tileB.el.style.transitionDuration = SWAP_MS + 'ms';
    setPos(tileB, a.r, a.c);
    setPos(tileA, b.r, b.c);
    sfx.swap();
  }

  function flashInvalid(elA, elB) {
    elA.classList.add('invalid');
    elB.classList.add('invalid');
    sfx.invalid();
    setTimeout(() => {
      elA.classList.remove('invalid');
      elB.classList.remove('invalid');
    }, 300);
  }

  function cellKey(r, c) {
    return `${r},${c}`;
  }

  function parseCellKey(key) {
    const [r, c] = key.split(',').map(Number);
    return { r, c };
  }

  function cellIsMatched(cell) {
    const matches = findMatches(snapshotGrid());
    return matches.some(m => m.r === cell.r && m.c === cell.c);
  }

  // The run(s) of 3+ currently passing through a cell.
  function matchRunsAt(cell) {
    const { runs } = findMatchesDetailed(snapshotGrid());
    return runs.filter(run => run.some(c => c.r === cell.r && c.c === cell.c));
  }

  // A match formed by the "quick swap" assist trick can involve OTHER tiles
  // that are still mid-swipe themselves (an assist gem sliding into the line).
  // Wait for all of them to finish (no longer tile.busy) before the match is
  // allowed to combine — otherwise the clear/converge animation can start while
  // an assist gem is still visibly sliding into place. a/b are excluded since
  // this swap's own animation is already accounted for by the caller.
  async function waitForOtherTilesToSettle(a, b) {
    const isAOrB = cell => (cell.r === a.r && cell.c === a.c) || (cell.r === b.r && cell.c === b.c);
    let waited = 0;
    while (waited < GRACE_MS) {
      const runs = [...matchRunsAt(a), ...matchRunsAt(b)];
      const stillSettling = runs.some(run => run.some(cell => {
        if (isAOrB(cell)) return false;
        const t = grid[cell.r][cell.c];
        return t && t.busy;
      }));
      if (!stillSettling) return;
      await sleep(GRACE_POLL_MS);
      waited += GRACE_POLL_MS;
    }
  }

  // Queues the actual clear+gravity resolution so concurrent swaps (which are
  // otherwise fully independent) never mutate the shared grid at the same time.
  function enqueueResolution(taskFn) {
    resolveQueue.push(taskFn);
    drainResolveQueue();
  }

  async function drainResolveQueue() {
    if (resolveQueueBusy) return;
    resolveQueueBusy = true;
    while (resolveQueue.length > 0) {
      const task = resolveQueue.shift();
      await task();
    }
    resolveQueueBusy = false;
  }

  // Waits for a match to appear at either cell without blocking anything else on
  // the board — this is what lets an assist swipe elsewhere complete the line
  // while this swap is still "hanging" in its swapped position.
  async function waitForGraceMatch(a, b) {
    if (cellIsMatched(a) || cellIsMatched(b)) return true;
    let elapsed = 0;
    while (elapsed < GRACE_MS) {
      await sleep(GRACE_POLL_MS);
      elapsed += GRACE_POLL_MS;
      if (cellIsMatched(a) || cellIsMatched(b)) return true;
    }
    return false;
  }

  // Only the two tiles being swapped are locked (tile.busy) — every other tile
  // on the board stays fully interactive, so several swipes can be in flight
  // at once. A swap that doesn't immediately match isn't reverted right away:
  // it hangs for a grace window, and even after reverting we check once more.
  // That's what enables the classic "quick swap" assist trick — moving other
  // same-color gems into the line while this swap is away completes the match
  // either while it's swapped out, or the instant it returns home.
  async function attemptSwap(a, b) {
    const tileA = grid[a.r][a.c];
    const tileB = grid[b.r][b.c];
    if (!tileA || !tileB || tileA.busy || tileB.busy) return;

    tileA.busy = true;
    tileB.busy = true;
    const elA = tileA.el;
    const elB = tileB.el;
    elA.classList.add('pending');
    elB.classList.add('pending');
    doSwap(a, b);
    await sleep(SWAP_MS);
    elA.style.transitionDuration = '';
    elB.style.transitionDuration = '';

    // A wildcard always activates on swipe, regardless of whether it forms a match.
    const wildcardTile = tileA.special === 'wildcard' ? tileA : (tileB.special === 'wildcard' ? tileB : null);
    if (wildcardTile) {
      const otherTile = wildcardTile === tileA ? tileB : tileA;
      elA.classList.remove('pending');
      elB.classList.remove('pending');
      enqueueResolution(async () => {
        moves++;
        movesEl.textContent = moves;
        await triggerWildcard(wildcardTile, otherTile);
        await resolveMatches();
      });
      tileA.busy = false;
      tileB.busy = false;
      return;
    }

    if (await waitForGraceMatch(a, b)) {
      // An assist gem forming part of this match may still be sliding into
      // place — let it finish before the match actually combines.
      await waitForOtherTilesToSettle(a, b);
      elA.classList.remove('pending');
      elB.classList.remove('pending');
      enqueueResolution(async () => {
        moves++;
        movesEl.textContent = moves;
        await resolveMatches({ from: a, to: b });
      });
      tileA.busy = false;
      tileB.busy = false;
      return;
    }

    // Still no match — revert, then check once more: an assist swipe may have
    // just completed the original line while this one was away.
    flashInvalid(elA, elB);
    if (grid[a.r][a.c] && grid[b.r][b.c]) doSwap(a, b);
    await sleep(SWAP_MS);
    elA.style.transitionDuration = '';
    elB.style.transitionDuration = '';

    if (cellIsMatched(a) || cellIsMatched(b)) {
      await waitForOtherTilesToSettle(a, b);
      enqueueResolution(async () => {
        moves++;
        movesEl.textContent = moves;
        await resolveMatches({ from: b, to: a });
      });
    }

    elA.classList.remove('pending');
    elB.classList.remove('pending');
    tileA.busy = false;
    tileB.busy = false;
  }

  // Clears every gem matching otherTile's color (plus the wildcard itself), with
  // a rainbow shockwave and a color-zap that ripples outward from the wildcard.
  async function triggerWildcard(wildcardTile, otherTile) {
    const targetColor = otherTile.gem;
    const origin = { r: wildcardTile.r, c: wildcardTile.c };

    const toClear = new Set([cellKey(origin.r, origin.c)]);
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (t && t.gem === targetColor) toClear.add(cellKey(r, c));
      }
    }

    const { bombOrigins, crossOrigins, blastCells, processedSpecials } = expandSpecialChain(toClear);

    const removed = [];
    for (const key of toClear) {
      const { r, c } = parseCellKey(key);
      const tile = grid[r][c];
      if (!tile) continue;
      removed.push(tile);
      grid[r][c] = null;
    }

    const originPx = cellCenterPx(origin.r, origin.c);
    spawnShockwave(originPx.x, originPx.y, {
      size: SIZE * CELL * 1.6,
      rainbow: true,
      durationMs: 700,
    });

    let maxDelay = 0;
    for (const tile of removed) {
      const dist = Math.hypot(tile.r - origin.r, tile.c - origin.c);
      const delay = dist * WILDCARD_STAGGER_MS;
      maxDelay = Math.max(maxDelay, delay);
      const key = cellKey(tile.r, tile.c);
      setTimeout(() => {
        tile.el.classList.add('zapped');
        if (blastCells.has(key)) explodeTile(tile);
        else setScale(tile, 0);
      }, delay);
    }
    for (const origin2 of bombOrigins) {
      const p = cellCenterPx(origin2.r, origin2.c);
      const dist = Math.hypot(origin2.r - origin.r, origin2.c - origin.c);
      setTimeout(() => spawnShockwave(p.x, p.y, { size: CELL * 3.2, durationMs: 550 }), dist * WILDCARD_STAGGER_MS);
    }
    for (const origin2 of crossOrigins) {
      const dist = Math.hypot(origin2.r - origin.r, origin2.c - origin.c);
      setTimeout(() => spawnCrossBeams(origin2), dist * WILDCARD_STAGGER_MS);
    }

    const gained = removed.length * 10 + 100 + bombOrigins.length * 50 + crossOrigins.length * 80;
    score += gained;
    scoreEl.textContent = score;
    messageEl.textContent = `Wildcard zap! +${gained}`;
    sfx.wildcardZap();

    const fadeMs = (bombOrigins.length > 0 || crossOrigins.length > 0) ? EXPLODE_MS : WILDCARD_FADE_MS;
    await sleep(maxDelay + fadeMs);
    for (const tile of removed) tile.el.remove();

    applyGravityAnimated();
    await sleep(FALL_MS);
  }

  async function resolveMatches(swapContext) {
    let chain = 0;
    let firstPass = true;
    while (true) {
      const { cells: matchedCells, runs } = findMatchesDetailed(snapshotGrid());
      if (matchedCells.length === 0) break;
      chain++;

      // L/T/+ shaped matches (an intersecting horizontal + vertical run, combined
      // size 5+) spawn a cross gem instead of two separate line specials. Runs of
      // 4 spawn a bomb; straight runs of 5+ spawn a wildcard. Whichever gem forms,
      // one cell of the match survives as the special instead of being cleared —
      // every other matched cell in that run/group flies in and converges into it.
      const isFree = cell => !grid[cell.r][cell.c] || !grid[cell.r][cell.c].special;
      const pickSwapPreferred = cells => firstPass && swapContext
        ? cells.find(cell =>
            isFree(cell) &&
            ((cell.r === swapContext.to.r && cell.c === swapContext.to.c) ||
              (cell.r === swapContext.from.r && cell.c === swapContext.from.c)))
        : null;

      const spawnMap = new Map();
      const convergeTarget = new Map();
      const crossGroups = findCrossGroups(runs);
      const crossClaimedRuns = new Set();
      for (const g of crossGroups) {
        crossClaimedRuns.add(g.hRun);
        crossClaimedRuns.add(g.vRun);
      }

      for (const g of crossGroups) {
        const groupCells = dedupeCells([...g.hRun, ...g.vRun]);
        const spawnCell = pickSwapPreferred(groupCells)
          || (isFree(g.intersection) ? g.intersection : null)
          || groupCells.find(isFree)
          || g.intersection;
        const spawnKey = cellKey(spawnCell.r, spawnCell.c);
        spawnMap.set(spawnKey, 'cross');
        for (const cell of groupCells) {
          const key = cellKey(cell.r, cell.c);
          if (key === spawnKey) continue;
          convergeTarget.set(key, spawnCell);
        }
      }

      for (const run of runs) {
        if (run.length < 4 || crossClaimedRuns.has(run)) continue;
        const type = run.length >= 5 ? 'wildcard' : 'bomb';
        const spawnCell = pickSwapPreferred(run) || run.find(isFree) || run[Math.floor(run.length / 2)];
        const spawnKey = cellKey(spawnCell.r, spawnCell.c);
        spawnMap.set(spawnKey, type);
        for (const cell of run) {
          const key = cellKey(cell.r, cell.c);
          if (key === spawnKey) continue;
          convergeTarget.set(key, spawnCell);
        }
      }
      firstPass = false;

      const toClear = new Set(matchedCells.map(({ r, c }) => cellKey(r, c)));
      for (const key of spawnMap.keys()) toClear.delete(key);

      // Any bomb or cross caught in the clear detonates — a 3x3 area or the full
      // row+column — which can chain into further specials the blast reaches.
      const { bombOrigins, crossOrigins, blastCells, processedSpecials } = expandSpecialChain(toClear);
      // A blast reaching a cell that was about to spawn a special gem destroys it
      // instead — anything that was converging toward it just fades normally.
      for (const key of toClear) spawnMap.delete(key);
      for (const [key, target] of [...convergeTarget]) {
        if (!spawnMap.has(cellKey(target.r, target.c))) convergeTarget.delete(key);
      }

      const removed = [];
      for (const key of toClear) {
        const { r, c } = parseCellKey(key);
        const tile = grid[r][c];
        if (!tile) continue;
        removed.push(tile);
        grid[r][c] = null;
      }

      for (const origin of bombOrigins) {
        const p = cellCenterPx(origin.r, origin.c);
        spawnShockwave(p.x, p.y, { size: CELL * 3.2, durationMs: 550 });
      }
      for (const origin of crossOrigins) {
        spawnCrossBeams(origin);
      }
      for (const tile of removed) {
        const key = cellKey(tile.r, tile.c);
        if (blastCells.has(key)) {
          explodeTile(tile);
        } else if (convergeTarget.has(key)) {
          const target = convergeTarget.get(key);
          convergeTile(tile, target.r, target.c);
        } else {
          setScale(tile, 0);
        }
      }

      // Let the converging gems arrive before the spawn cell visibly pops into
      // its special form — always true here, since a spawning run/group always
      // has at least one other matched cell converging into it.
      for (const [key, type] of spawnMap) {
        const { r, c } = parseCellKey(key);
        const tile = grid[r][c];
        if (!tile) continue;
        setTimeout(() => markSpecial(tile, type), Math.round(CONVERGE_MS * 0.7));
      }

      const gained = toClear.size * 10 * chain + bombOrigins.length * 50 + crossOrigins.length * 80;
      score += gained;
      scoreEl.textContent = score;
      const spawnedTypes = [...spawnMap.values()];
      if (crossOrigins.length > 0) sfx.cross();
      if (bombOrigins.length > 0) sfx.bomb();
      if (crossOrigins.length === 0 && bombOrigins.length === 0) {
        if (spawnedTypes.length > 0) sfx.special();
        else sfx.match(chain);
      }
      if (crossOrigins.length > 0) {
        messageEl.textContent = `Cross blast! +${gained}`;
      } else if (bombOrigins.length > 0) {
        messageEl.textContent = `Boom! +${gained}`;
      } else if (spawnedTypes.includes('cross')) {
        messageEl.textContent = `Cross gem created! +${gained}`;
      } else if (spawnedTypes.includes('wildcard')) {
        messageEl.textContent = `Wildcard gem created! +${gained}`;
      } else if (spawnedTypes.length > 0) {
        messageEl.textContent = `Special gem created! +${gained}`;
      } else {
        messageEl.textContent = chain > 1 ? `Combo x${chain}! +${gained}` : `Match! +${gained}`;
      }

      let waitMs = MATCH_MS;
      if (convergeTarget.size > 0) waitMs = Math.max(waitMs, CONVERGE_MS);
      if (bombOrigins.length > 0 || crossOrigins.length > 0) waitMs = Math.max(waitMs, EXPLODE_MS);
      await sleep(waitMs);
      for (const tile of removed) tile.el.remove();

      applyGravityAnimated();
      await sleep(FALL_MS);
    }

    if (chain > 0 && !hasPossibleMove(snapshotGrid())) {
      messageEl.textContent = 'No moves left — reshuffling...';
      sfx.reshuffle();
      await sleep(500);
      buildBoardFromLayout(genLayout());
    }

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('bejeweled-best', String(best));
    }

    if (chain === 0) {
      messageEl.textContent = '';
    } else {
      setTimeout(() => {
        messageEl.textContent = '';
      }, 1200);
    }
  }

  function applyGravityAnimated() {
    for (let c = 0; c < SIZE; c++) {
      const survivors = [];
      for (let r = 0; r < SIZE; r++) {
        const t = grid[r][c];
        if (t) survivors.push(t);
      }
      const missing = SIZE - survivors.length;

      for (let i = 0; i < survivors.length; i++) {
        const targetR = missing + i;
        const tile = survivors[i];
        grid[targetR][c] = tile;
        setPos(tile, targetR, c);
      }

      for (let i = 0; i < missing; i++) {
        const targetR = i;
        const startR = i - missing;
        // createTile already places the tile instantly (with a forced reflow),
        // so the starting frame is already committed — animating to its final
        // row can happen synchronously right here. This used to be deferred via
        // requestAnimationFrame, but that callback can be delayed or dropped
        // (a backgrounded tab, heavy concurrent activity from other swipes),
        // silently leaving the tile stuck off-board while the grid thinks the
        // cell is filled.
        const tile = createTile(startR, c, randomGem());
        grid[targetR][c] = tile;
        setPos(tile, targetR, c);
      }
    }
  }

  function newGame() {
    score = 0;
    moves = 0;
    selected = null;
    resolveQueue = [];
    scoreEl.textContent = '0';
    movesEl.textContent = '0';
    messageEl.textContent = '';
    buildBoardFromLayout(genLayout());
  }

  restartBtn.addEventListener('click', newGame);
  shuffleBtn.addEventListener('click', () => {
    resolveQueue = [];
    buildBoardFromLayout(genLayout());
    messageEl.textContent = 'Board shuffled!';
  });

  swapSpeedInput.addEventListener('input', () => {
    SWAP_MS = Number(swapSpeedInput.value);
    swapSpeedValue.textContent = SWAP_MS + 'ms';
  });

  muteBtn.textContent = soundEnabled ? '🔊' : '🔇';
  muteBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    muteBtn.textContent = soundEnabled ? '🔊' : '🔇';
    localStorage.setItem('bejeweled-sound', soundEnabled ? 'on' : 'off');
    if (soundEnabled) getAudioCtx();
  });

  newGame();
})();
</script>
</body>
</html>
