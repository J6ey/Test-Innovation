<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejeweled</title>
<style>
  :root {
    --bg-dark: #0f0c29;
    --board-bg: #1a1533;
    --tile-size: 60px;
    --gap: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #2b2350, #0f0c29 70%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #f0eaff;
    padding: 20px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 2.2rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd700, #ff6ec7, #6ecbff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  .subtitle {
    opacity: 0.7;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  .hud .label {
    opacity: 0.6;
    font-size: 0.75rem;
    display: block;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .hud .value {
    font-weight: bold;
    font-size: 1.4rem;
  }

  #board {
    display: grid;
    background: var(--board-bg);
    padding: var(--gap);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    gap: var(--gap);
  }

  .tile {
    width: var(--tile-size);
    height: var(--tile-size);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--tile-size) * 0.55);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
  }

  .tile:hover {
    transform: scale(1.06);
  }

  .tile.selected {
    box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(255,255,255,0.7);
    transform: scale(1.08);
  }

  .tile.matched {
    animation: pop 0.3s ease forwards;
  }

  .tile.falling {
    animation: none;
  }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.2); opacity: 0; }
  }

  .tile.swap-invalid {
    animation: shake 0.3s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  #message {
    margin-top: 14px;
    min-height: 24px;
    font-size: 1rem;
    opacity: 0.85;
  }

  #controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }

  button {
    background: linear-gradient(135deg, #6ecbff, #ff6ec7);
    border: none;
    color: #10082a;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
  }

  button:hover {
    filter: brightness(1.1);
  }

  button:active {
    transform: translateY(1px);
  }
</style>
</head>
<body>
  <h1>💎 BEJEWELED 💎</h1>
  <div class="subtitle">Swap adjacent gems to match 3 or more</div>

  <div class="hud">
    <div>
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div>
      <span class="label">Moves</span>
      <span class="value" id="moves">0</span>
    </div>
    <div>
      <span class="label">Best</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div id="board"></div>
  <div id="message"></div>

  <div id="controls">
    <button id="restart">New Game</button>
    <button id="shuffle">Shuffle</button>
  </div>

<script>
(function () {
  const SIZE = 8;
  const GEMS = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣'];
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restart');
  const shuffleBtn = document.getElementById('shuffle');

  board.style.gridTemplateColumns = `repeat(${SIZE}, var(--tile-size))`;
  board.style.gridTemplateRows = `repeat(${SIZE}, var(--tile-size))`;

  let grid = [];
  let score = 0;
  let moves = 0;
  let best = Number(localStorage.getItem('bejeweled-best') || 0);
  let selected = null;
  let locked = false;

  bestEl.textContent = best;

  function randomGem() {
    return Math.floor(Math.random() * GEMS.length);
  }

  function createInitialGrid() {
    let g;
    do {
      g = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          let gem;
          do {
            gem = randomGem();
          } while (
            (c >= 2 && row[c - 1] === gem && row[c - 2] === gem) ||
            (r >= 2 && g[r - 1][c] === gem && g[r - 2][c] === gem)
          );
          row.push(gem);
        }
        g.push(row);
      }
    } while (findMatches(g).length === 0 && !hasPossibleMove(g));
    return g;
  }

  function render() {
    board.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.r = r;
        tile.dataset.c = c;
        const gemIdx = grid[r][c];
        tile.textContent = gemIdx === null ? '' : GEMS[gemIdx];
        if (selected && selected.r === r && selected.c === c) {
          tile.classList.add('selected');
        }
        tile.addEventListener('click', onTileClick);
        board.appendChild(tile);
      }
    }
  }

  function onTileClick(e) {
    if (locked) return;
    const r = Number(e.currentTarget.dataset.r);
    const c = Number(e.currentTarget.dataset.c);

    if (!selected) {
      selected = { r, c };
      render();
      return;
    }

    if (selected.r === r && selected.c === c) {
      selected = null;
      render();
      return;
    }

    const isAdjacent =
      (Math.abs(selected.r - r) === 1 && selected.c === c) ||
      (Math.abs(selected.c - c) === 1 && selected.r === r);

    if (!isAdjacent) {
      selected = { r, c };
      render();
      return;
    }

    attemptSwap(selected, { r, c });
  }

  function swapCells(a, b) {
    const tmp = grid[a.r][a.c];
    grid[a.r][a.c] = grid[b.r][b.c];
    grid[b.r][b.c] = tmp;
  }

  async function attemptSwap(a, b) {
    locked = true;
    swapCells(a, b);
    const matches = findMatches(grid);

    if (matches.length === 0) {
      render();
      await sleep(80);
      const tiles = [...board.children];
      const ai = a.r * SIZE + a.c;
      const bi = b.r * SIZE + b.c;
      tiles[ai].classList.add('swap-invalid');
      tiles[bi].classList.add('swap-invalid');
      await sleep(300);
      swapCells(a, b);
      selected = null;
      render();
      locked = false;
      return;
    }

    moves++;
    movesEl.textContent = moves;
    selected = null;
    render();
    await resolveMatches();
    locked = false;
  }

  function findMatches(g) {
    const matched = new Set();

    for (let r = 0; r < SIZE; r++) {
      let runStart = 0;
      for (let c = 1; c <= SIZE; c++) {
        const same = c < SIZE && g[r][c] !== null && g[r][c] === g[r][runStart];
        if (!same) {
          if (c - runStart >= 3) {
            for (let k = runStart; k < c; k++) matched.add(r * SIZE + k);
          }
          runStart = c;
        }
      }
    }

    for (let c = 0; c < SIZE; c++) {
      let runStart = 0;
      for (let r = 1; r <= SIZE; r++) {
        const same = r < SIZE && g[r][c] !== null && g[r][c] === g[runStart][c];
        if (!same) {
          if (r - runStart >= 3) {
            for (let k = runStart; k < r; k++) matched.add(k * SIZE + c);
          }
          runStart = r;
        }
      }
    }

    return [...matched].map(i => ({ r: Math.floor(i / SIZE), c: i % SIZE }));
  }

  function hasPossibleMove(g) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r][c + 1];
          clone[r][c + 1] = tmp;
          if (findMatches(clone).length > 0) return true;
        }
        if (r < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r + 1][c];
          clone[r + 1][c] = tmp;
          if (findMatches(clone).length > 0) return true;
        }
      }
    }
    return false;
  }

  function sleep(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  async function resolveMatches() {
    let chain = 0;
    while (true) {
      const matches = findMatches(grid);
      if (matches.length === 0) break;
      chain++;

      const tiles = [...board.children];
      for (const { r, c } of matches) {
        tiles[r * SIZE + c].classList.add('matched');
      }

      const gained = matches.length * 10 * chain;
      score += gained;
      scoreEl.textContent = score;
      messageEl.textContent = chain > 1 ? `Combo x${chain}! +${gained}` : `Match! +${gained}`;

      await sleep(280);

      for (const { r, c } of matches) {
        grid[r][c] = null;
      }

      applyGravity();
      render();
      await sleep(150);
    }

    if (chain > 0 && !hasPossibleMove(grid)) {
      messageEl.textContent = 'No moves left — reshuffling...';
      await sleep(600);
      grid = createInitialGrid();
      render();
    }

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('bejeweled-best', String(best));
    }

    if (chain === 0) {
      messageEl.textContent = '';
    } else {
      setTimeout(() => {
        if (!locked) messageEl.textContent = '';
      }, 1200);
    }
  }

  function applyGravity() {
    for (let c = 0; c < SIZE; c++) {
      const column = [];
      for (let r = SIZE - 1; r >= 0; r--) {
        if (grid[r][c] !== null) column.push(grid[r][c]);
      }
      while (column.length < SIZE) column.push(randomGem());
      for (let r = SIZE - 1; r >= 0; r--) {
        grid[r][c] = column[SIZE - 1 - r];
      }
    }
  }

  function newGame() {
    score = 0;
    moves = 0;
    selected = null;
    locked = false;
    scoreEl.textContent = '0';
    movesEl.textContent = '0';
    messageEl.textContent = '';
    grid = createInitialGrid();
    render();
  }

  restartBtn.addEventListener('click', newGame);
  shuffleBtn.addEventListener('click', () => {
    if (locked) return;
    grid = createInitialGrid();
    messageEl.textContent = 'Board shuffled!';
    render();
  });

  newGame();
})();
</script>
</body>
</html>
