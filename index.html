<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejeweled</title>
<style>
  :root {
    --bg-dark: #0f0c29;
    --board-bg: #1a1533;
    --tile-size: 60px;
    --gap: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #2b2350, #0f0c29 70%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #f0eaff;
    padding: 20px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 2.2rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd700, #ff6ec7, #6ecbff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  .subtitle {
    opacity: 0.7;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  .hud .label {
    opacity: 0.6;
    font-size: 0.75rem;
    display: block;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .hud .value {
    font-weight: bold;
    font-size: 1.4rem;
  }

  #board {
    position: relative;
    background: var(--board-bg);
    padding: var(--gap);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
    touch-action: none;
  }

  .tile {
    position: absolute;
    top: var(--gap);
    left: var(--gap);
    width: var(--tile-size);
    height: var(--tile-size);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--tile-size) * 0.55);
    cursor: grab;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
    transition: transform 0.26s cubic-bezier(0.34, 1.2, 0.4, 1), opacity 0.26s ease, filter 0.2s ease, box-shadow 0.15s ease;
    will-change: transform;
  }

  .tile:hover {
    filter: brightness(1.12);
  }

  .tile.selected {
    box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(255,255,255,0.7);
    filter: brightness(1.15);
  }

  .tile.invalid {
    animation: invalidFlash 0.3s ease;
  }

  @keyframes invalidFlash {
    0%, 100% { filter: none; }
    50% { filter: brightness(1.9) saturate(2) hue-rotate(-20deg); }
  }

  #message {
    margin-top: 14px;
    min-height: 24px;
    font-size: 1rem;
    opacity: 0.85;
  }

  #controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }

  button {
    background: linear-gradient(135deg, #6ecbff, #ff6ec7);
    border: none;
    color: #10082a;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
  }

  button:hover {
    filter: brightness(1.1);
  }

  button:active {
    transform: translateY(1px);
  }
</style>
</head>
<body>
  <h1>💎 BEJEWELED 💎</h1>
  <div class="subtitle">Swap adjacent gems to match 3 or more — click, drag, or swipe</div>

  <div class="hud">
    <div>
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div>
      <span class="label">Moves</span>
      <span class="value" id="moves">0</span>
    </div>
    <div>
      <span class="label">Best</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div id="board"></div>
  <div id="message"></div>

  <div id="controls">
    <button id="restart">New Game</button>
    <button id="shuffle">Shuffle</button>
  </div>

<script>
(function () {
  const SIZE = 8;
  const GEMS = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣'];
  const TILE = 60;
  const GAP = 6;
  const CELL = TILE + GAP;
  const SWAP_MS = 280;
  const MATCH_MS = 300;
  const FALL_MS = 320;
  const SWIPE_THRESHOLD = 18;

  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restart');
  const shuffleBtn = document.getElementById('shuffle');

  board.style.width = (SIZE * TILE + (SIZE - 1) * GAP) + 'px';
  board.style.height = (SIZE * TILE + (SIZE - 1) * GAP) + 'px';

  let grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  let score = 0;
  let moves = 0;
  let best = Number(localStorage.getItem('bejeweled-best') || 0);
  let selected = null;
  let locked = false;
  let nextId = 0;
  let pointerState = null;

  bestEl.textContent = best;

  function randomGem() {
    return Math.floor(Math.random() * GEMS.length);
  }

  function sleep(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  // ---- pure matching helpers (operate on plain 2D arrays of gem indices) ----

  function findMatches(g) {
    const matched = new Set();

    for (let r = 0; r < SIZE; r++) {
      let runStart = 0;
      for (let c = 1; c <= SIZE; c++) {
        const same = c < SIZE && g[r][c] !== null && g[r][c] === g[r][runStart];
        if (!same) {
          if (c - runStart >= 3) {
            for (let k = runStart; k < c; k++) matched.add(r * SIZE + k);
          }
          runStart = c;
        }
      }
    }

    for (let c = 0; c < SIZE; c++) {
      let runStart = 0;
      for (let r = 1; r <= SIZE; r++) {
        const same = r < SIZE && g[r][c] !== null && g[r][c] === g[runStart][c];
        if (!same) {
          if (r - runStart >= 3) {
            for (let k = runStart; k < r; k++) matched.add(k * SIZE + c);
          }
          runStart = r;
        }
      }
    }

    return [...matched].map(i => ({ r: Math.floor(i / SIZE), c: i % SIZE }));
  }

  function hasPossibleMove(g) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r][c + 1];
          clone[r][c + 1] = tmp;
          if (findMatches(clone).length > 0) return true;
        }
        if (r < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r + 1][c];
          clone[r + 1][c] = tmp;
          if (findMatches(clone).length > 0) return true;
        }
      }
    }
    return false;
  }

  function genLayout() {
    let g;
    do {
      g = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          let gem;
          do {
            gem = randomGem();
          } while (
            (c >= 2 && row[c - 1] === gem && row[c - 2] === gem) ||
            (r >= 2 && g[r - 1][c] === gem && g[r - 2][c] === gem)
          );
          row.push(gem);
        }
        g.push(row);
      }
    } while (findMatches(g).length === 0 && !hasPossibleMove(g));
    return g;
  }

  function snapshotGrid() {
    return grid.map(row => row.map(t => (t ? t.gem : null)));
  }

  // ---- tile objects + animated positioning ----

  function setPos(tile, r, c, instant) {
    tile.r = r;
    tile.c = c;
    const x = c * CELL;
    const y = r * CELL;
    if (instant) tile.el.style.transition = 'none';
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(${tile.scale})`;
    if (instant) {
      tile.el.offsetHeight;
      tile.el.style.transition = '';
    }
  }

  function setScale(tile, scale) {
    tile.scale = scale;
    const x = tile.c * CELL;
    const y = tile.r * CELL;
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    tile.el.style.opacity = String(scale);
  }

  function createTile(r, c, gem) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.textContent = GEMS[gem];
    el.addEventListener('pointerdown', onPointerDown);
    el.addEventListener('pointermove', onPointerMove);
    el.addEventListener('pointerup', onPointerUp);
    el.addEventListener('pointercancel', onPointerCancel);
    board.appendChild(el);
    const tile = { id: nextId++, gem, r, c, el, scale: 1 };
    el._tile = tile;
    setPos(tile, r, c, true);
    return tile;
  }

  function clearBoard() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) grid[r][c] = null;
    }
    board.innerHTML = '';
  }

  function buildBoardFromLayout(layout) {
    clearBoard();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        grid[r][c] = createTile(r, c, layout[r][c]);
      }
    }
  }

  // ---- selection + input (click/tap and swipe/drag share attemptSwap) ----

  function selectTile(r, c) {
    selected = { r, c };
    grid[r][c].el.classList.add('selected');
  }

  function clearSelection() {
    if (selected) {
      const t = grid[selected.r][selected.c];
      if (t) t.el.classList.remove('selected');
    }
    selected = null;
  }

  function handleTap(r, c) {
    if (locked) return;
    if (!selected) {
      selectTile(r, c);
      return;
    }
    if (selected.r === r && selected.c === c) {
      clearSelection();
      return;
    }
    const isAdjacent =
      (Math.abs(selected.r - r) === 1 && selected.c === c) ||
      (Math.abs(selected.c - c) === 1 && selected.r === r);
    if (!isAdjacent) {
      clearSelection();
      selectTile(r, c);
      return;
    }
    const from = selected;
    clearSelection();
    attemptSwap(from, { r, c });
  }

  function onPointerDown(e) {
    if (locked) return;
    const tile = e.currentTarget._tile;
    pointerState = {
      pointerId: e.pointerId,
      r: tile.r,
      c: tile.c,
      startX: e.clientX,
      startY: e.clientY,
      moved: false,
    };
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {
      // pointer may no longer be active (rapid tap/touch edge cases) — safe to ignore
    }
  }

  function onPointerMove(e) {
    if (!pointerState || pointerState.pointerId !== e.pointerId || pointerState.moved || locked) return;
    const dx = e.clientX - pointerState.startX;
    const dy = e.clientY - pointerState.startY;
    if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;

    pointerState.moved = true;
    let targetR = pointerState.r;
    let targetC = pointerState.c;
    if (Math.abs(dx) > Math.abs(dy)) {
      targetC += dx > 0 ? 1 : -1;
    } else {
      targetR += dy > 0 ? 1 : -1;
    }

    const from = { r: pointerState.r, c: pointerState.c };
    clearSelection();
    if (targetR >= 0 && targetR < SIZE && targetC >= 0 && targetC < SIZE) {
      attemptSwap(from, { r: targetR, c: targetC });
    }
  }

  function onPointerUp(e) {
    if (!pointerState || pointerState.pointerId !== e.pointerId) {
      pointerState = null;
      return;
    }
    const { r, c, moved } = pointerState;
    pointerState = null;
    if (!moved) handleTap(r, c);
  }

  function onPointerCancel() {
    pointerState = null;
  }

  // ---- swap / match / gravity ----

  function doSwap(a, b) {
    const tileA = grid[a.r][a.c];
    const tileB = grid[b.r][b.c];
    grid[a.r][a.c] = tileB;
    grid[b.r][b.c] = tileA;
    setPos(tileB, a.r, a.c);
    setPos(tileA, b.r, b.c);
  }

  function flashInvalid(elA, elB) {
    elA.classList.add('invalid');
    elB.classList.add('invalid');
    setTimeout(() => {
      elA.classList.remove('invalid');
      elB.classList.remove('invalid');
    }, 300);
  }

  async function attemptSwap(a, b) {
    if (locked) return;
    const tileA = grid[a.r][a.c];
    const tileB = grid[b.r][b.c];
    if (!tileA || !tileB) return;

    locked = true;
    const elA = tileA.el;
    const elB = tileB.el;
    doSwap(a, b);
    await sleep(SWAP_MS);

    const matches = findMatches(snapshotGrid());
    if (matches.length === 0) {
      flashInvalid(elA, elB);
      doSwap(a, b);
      await sleep(SWAP_MS);
      locked = false;
      return;
    }

    moves++;
    movesEl.textContent = moves;
    await resolveMatches();
    locked = false;
  }

  async function resolveMatches() {
    let chain = 0;
    while (true) {
      const matches = findMatches(snapshotGrid());
      if (matches.length === 0) break;
      chain++;

      const removed = [];
      for (const { r, c } of matches) {
        const tile = grid[r][c];
        removed.push(tile);
        setScale(tile, 0);
        grid[r][c] = null;
      }

      const gained = matches.length * 10 * chain;
      score += gained;
      scoreEl.textContent = score;
      messageEl.textContent = chain > 1 ? `Combo x${chain}! +${gained}` : `Match! +${gained}`;

      await sleep(MATCH_MS);
      for (const tile of removed) tile.el.remove();

      applyGravityAnimated();
      await sleep(FALL_MS);
    }

    if (chain > 0 && !hasPossibleMove(snapshotGrid())) {
      messageEl.textContent = 'No moves left — reshuffling...';
      await sleep(500);
      buildBoardFromLayout(genLayout());
    }

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('bejeweled-best', String(best));
    }

    if (chain === 0) {
      messageEl.textContent = '';
    } else {
      setTimeout(() => {
        if (!locked) messageEl.textContent = '';
      }, 1200);
    }
  }

  function applyGravityAnimated() {
    for (let c = 0; c < SIZE; c++) {
      const survivors = [];
      for (let r = 0; r < SIZE; r++) {
        const t = grid[r][c];
        if (t) survivors.push(t);
      }
      const missing = SIZE - survivors.length;

      for (let i = 0; i < survivors.length; i++) {
        const targetR = missing + i;
        const tile = survivors[i];
        grid[targetR][c] = tile;
        setPos(tile, targetR, c);
      }

      for (let i = 0; i < missing; i++) {
        const targetR = i;
        const startR = i - missing;
        const tile = createTile(startR, c, randomGem());
        grid[targetR][c] = tile;
        requestAnimationFrame(() => setPos(tile, targetR, c));
      }
    }
  }

  function newGame() {
    score = 0;
    moves = 0;
    selected = null;
    locked = false;
    scoreEl.textContent = '0';
    movesEl.textContent = '0';
    messageEl.textContent = '';
    buildBoardFromLayout(genLayout());
  }

  restartBtn.addEventListener('click', newGame);
  shuffleBtn.addEventListener('click', () => {
    if (locked) return;
    buildBoardFromLayout(genLayout());
    messageEl.textContent = 'Board shuffled!';
  });

  newGame();
})();
</script>
</body>
</html>
