<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejeweled</title>
<style>
  :root {
    --bg-dark: #0f0c29;
    --board-bg: #1a1533;
    --tile-size: 60px;
    --gap: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    overflow-x: hidden;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #2b2350, #0f0c29 70%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #f0eaff;
    padding: 20px;
  }

  @media (max-width: 480px) {
    body { padding: 10px; }
  }

  h1 {
    margin: 0 0 4px;
    font-size: 2.2rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd700, #ff6ec7, #6ecbff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  .subtitle {
    opacity: 0.7;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  .hud .label {
    opacity: 0.6;
    font-size: 0.75rem;
    display: block;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .hud .value {
    font-weight: bold;
    font-size: 1.4rem;
  }

  #board {
    position: relative;
    background: var(--board-bg);
    padding: var(--gap);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
    touch-action: none;
  }

  .tile {
    position: absolute;
    top: var(--gap);
    left: var(--gap);
    width: var(--tile-size);
    height: var(--tile-size);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--tile-size) * 0.55);
    cursor: grab;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
    transition: transform 0.26s cubic-bezier(0.34, 1.2, 0.4, 1), opacity 0.26s ease, filter 0.2s ease, box-shadow 0.15s ease;
    will-change: transform;
  }

  .tile:hover {
    filter: brightness(1.12);
  }

  .tile.selected {
    box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(255,255,255,0.7);
    filter: brightness(1.15);
  }

  .tile.invalid {
    animation: invalidFlash 0.3s ease;
  }

  @keyframes invalidFlash {
    0%, 100% { filter: none; }
    50% { filter: brightness(1.9) saturate(2) hue-rotate(-20deg); }
  }

  .tile.pending {
    box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.85), 0 0 14px 4px rgba(255, 215, 0, 0.5),
      inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
    animation: pendingPulse 0.5s ease-in-out infinite;
  }

  @keyframes pendingPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .tile.special {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 0 16px 5px rgba(255,255,255,0.55),
      inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.3);
    animation: specialPulse 1.2s ease-in-out infinite;
  }

  .tile.special.bomb::after {
    content: '✦';
    position: absolute;
    top: 1px;
    right: 4px;
    font-size: 0.9rem;
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,0.9);
    pointer-events: none;
  }

  @keyframes specialPulse {
    0%, 100% { filter: brightness(1) saturate(1.1); }
    50% { filter: brightness(1.55) saturate(1.7); }
  }

  .tile.special.wildcard {
    background: conic-gradient(from 0deg, #ff6ec7, #ffd700, #6ecbff, #7cff6e, #ff6ec7);
    animation: wildcardShimmer 2.4s linear infinite, specialPulse 1.2s ease-in-out infinite;
  }

  @keyframes wildcardShimmer {
    from { filter: hue-rotate(0deg) brightness(1.05); }
    to { filter: hue-rotate(360deg) brightness(1.05); }
  }

  .tile.special.cross {
    background: radial-gradient(circle, #ffffff 0%, #9fe3ff 55%, #4aa8ff 100%);
  }

  .tile.special.cross::after {
    content: '✚';
    position: absolute;
    top: 1px;
    right: 4px;
    font-size: 0.9rem;
    color: #063a5e;
    text-shadow: 0 0 6px rgba(255,255,255,0.9);
    pointer-events: none;
  }

  .shockwave.combo {
    background: conic-gradient(from 0deg, #ff6ec7, #ffd700, #6ecbff, #7cff6e, #d9a6ff, #ff6ec7);
    opacity: 0.6;
    mix-blend-mode: screen;
    box-shadow: 0 0 80px 20px rgba(255,255,255,0.45);
  }

  .beam {
    position: absolute;
    pointer-events: none;
    z-index: 6;
    border-radius: 4px;
    box-shadow: 0 0 24px 6px rgba(180,230,255,0.8);
    transform-origin: center;
  }

  .beam-h {
    height: 8px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95) 15%, rgba(140,220,255,0.9) 50%, rgba(255,255,255,0.95) 85%, transparent);
    animation: beamSweepH 0.45s ease-out forwards;
  }

  .beam-v {
    width: 8px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.95) 15%, rgba(140,220,255,0.9) 50%, rgba(255,255,255,0.95) 85%, transparent);
    animation: beamSweepV 0.45s ease-out forwards;
  }

  @keyframes beamSweepH {
    0% { transform: scaleX(0); opacity: 1; }
    70% { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(1); opacity: 0; }
  }

  @keyframes beamSweepV {
    0% { transform: scaleY(0); opacity: 1; }
    70% { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); opacity: 0; }
  }

  .laser-beam {
    position: absolute;
    top: 0;
    left: 0;
    height: 4px;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, #ffffff, #8dffe0 30%, #40f0ff 60%, #ff5fd0 90%, transparent);
    box-shadow: 0 0 16px 4px rgba(130,240,255,0.85);
    border-radius: 3px;
    pointer-events: none;
    z-index: 6;
    animation: laserFlash 0.26s ease-out forwards;
  }

  @keyframes laserFlash {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  .tile.zapped {
    animation: zapFlash 0.3s ease;
  }

  @keyframes zapFlash {
    0% { filter: brightness(1) saturate(1); }
    35% { filter: brightness(2.3) saturate(2.6) hue-rotate(60deg); }
    100% { filter: brightness(1) saturate(1); }
  }

  .shockwave {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transform: scale(0.15);
    opacity: 1;
    animation-name: shockwaveAnim;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    z-index: 5;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,190,80,0.65) 30%, rgba(255,100,60,0.25) 55%, transparent 75%);
    box-shadow: 0 0 40px 10px rgba(255,180,80,0.55);
  }

  .shockwave.rainbow {
    background: conic-gradient(from 0deg, #ff6ec7, #ffd700, #6ecbff, #7cff6e, #ff6ec7);
    opacity: 0.5;
    mix-blend-mode: screen;
    box-shadow: 0 0 60px 16px rgba(255,255,255,0.35);
  }

  @keyframes shockwaveAnim {
    0% { transform: scale(0.1); opacity: 1; }
    60% { opacity: 0.75; }
    100% { transform: scale(1); opacity: 0; }
  }

  #message {
    margin-top: 14px;
    min-height: 24px;
    font-size: 1rem;
    opacity: 0.85;
  }

  #controls {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  button {
    background: linear-gradient(135deg, #6ecbff, #ff6ec7);
    border: none;
    color: #10082a;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
  }

  button:hover {
    filter: brightness(1.1);
  }

  button:active {
    transform: translateY(1px);
  }

  #settings {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  #settings label {
    font-size: 0.8rem;
    opacity: 0.75;
    letter-spacing: 0.3px;
  }

  #settings label span {
    opacity: 1;
    font-weight: bold;
    color: #ffd700;
  }

  #settings input[type="range"] {
    width: 220px;
    max-width: 80vw;
    accent-color: #ff6ec7;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>💎 BEJEWELED 💎</h1>
  <div class="subtitle">Match 4 in a row or a 2x2 block for a blast gem, 5 in a line for a wildcard, or an L/T/+ shape for a cross gem — swap two specials together for a combo</div>

  <div class="hud">
    <div>
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div>
      <span class="label">Moves</span>
      <span class="value" id="moves">0</span>
    </div>
    <div>
      <span class="label">Best</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div id="board"></div>
  <div id="message"></div>

  <div id="controls">
    <button id="restart">New Game</button>
    <button id="shuffle">Shuffle</button>
    <button id="muteBtn" aria-label="Toggle sound">🔊</button>
  </div>

  <div id="settings">
    <label for="swapSpeed">Swap delay: <span id="swapSpeedValue">280ms</span></label>
    <input type="range" id="swapSpeed" min="100" max="900" step="10" value="280">
  </div>

<script>
(function () {
  const SIZE = 8;
  const GEMS = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣'];
  // Tile/gap/board size shrink to fit narrow (mobile) viewports — see
  // applyTileMetrics() below, which sets these on load and on resize.
  const MAX_TILE = 60;
  const MIN_TILE = 26;
  let TILE = MAX_TILE;
  let GAP = 6;
  let CELL = TILE + GAP;
  let boardSize = 0;
  let SWAP_MS = 280;
  const MATCH_MS = 300;
  const CONVERGE_MS = 380;
  const EXPLODE_MS = 500;
  const FALL_MS = 320;
  const SWIPE_THRESHOLD = 18;
  const WILDCARD_STAGGER_MS = 35;
  const WILDCARD_FADE_MS = 280;
  // Gap between successive "waves" of a chain reaction (expandSpecialChain's
  // `wave`) — an initial special's own effect gets to visibly play out before
  // a special its blast catches fires its own, instead of everything firing
  // at once.
  const CHAIN_STAGGER_MS = 320;

  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restart');
  const shuffleBtn = document.getElementById('shuffle');
  const swapSpeedInput = document.getElementById('swapSpeed');
  const swapSpeedValue = document.getElementById('swapSpeedValue');
  const muteBtn = document.getElementById('muteBtn');

  // Picks the largest tile size (down to MIN_TILE) whose board still fits the
  // viewport's available width, so the board never overflows a phone screen.
  function computeTileMetrics() {
    const bodyStyle = getComputedStyle(document.body);
    const paddingX = parseFloat(bodyStyle.paddingLeft) + parseFloat(bodyStyle.paddingRight);
    const available = Math.max(200, document.documentElement.clientWidth - paddingX);
    let tile = MAX_TILE;
    let gap = Math.max(3, Math.round(tile * 0.1));
    while (tile > MIN_TILE && SIZE * tile + (SIZE + 1) * gap > available) {
      tile--;
      gap = Math.max(3, Math.round(tile * 0.1));
    }
    return { tile, gap };
  }

  // box-sizing: border-box means #board's own padding eats into the size we
  // set here, so the board box must also account for that padding (2x GAP) on
  // top of the space the tiles themselves need — otherwise the last row/column
  // is clipped by the board's overflow:hidden.
  function applyTileMetrics() {
    const metrics = computeTileMetrics();
    TILE = metrics.tile;
    GAP = metrics.gap;
    CELL = TILE + GAP;
    boardSize = SIZE * TILE + (SIZE + 1) * GAP;
    document.documentElement.style.setProperty('--tile-size', TILE + 'px');
    document.documentElement.style.setProperty('--gap', GAP + 'px');
    board.style.width = boardSize + 'px';
    board.style.height = boardSize + 'px';
    // Snap any existing tiles to their (unchanged) grid cell at the new size —
    // instant, no transition, so a resize doesn't animate every tile sliding.
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (t) setPos(t, r, c, true);
      }
    }
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyTileMetrics, 150);
  });

  const GRACE_MS = 650;
  const GRACE_POLL_MS = 50;
  // Matches the swap-speed slider's max="900" — the longest an individual
  // tile's own swap animation could legitimately still be running.
  const SWAP_MS_MAX = 900;

  let grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  let score = 0;
  let moves = 0;
  let best = Number(localStorage.getItem('bejeweled-best') || 0);
  let selected = null;
  let nextId = 0;
  const pointerStates = new Map();
  // Multiple swaps can be in flight at once (each tile only blocks itself via
  // tile.busy). Once a swap is confirmed as a match it's handed to this queue
  // so the actual clear+gravity animations never run concurrently and stomp
  // on each other's board state.
  let resolveQueue = [];
  let resolveQueueBusy = false;

  bestEl.textContent = best;

  function randomGem() {
    return Math.floor(Math.random() * GEMS.length);
  }

  function sleep(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  // ---- sound (synthesized with Web Audio, no audio files needed) ----

  let soundEnabled = localStorage.getItem('bejeweled-sound') !== 'off';
  let audioCtx = null;

  function getAudioCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone({ freq, freqEnd, duration, type = 'sine', gain = 0.18, delay = 0 }) {
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const start = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), start + duration);
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  function playNoise({ duration, gain = 0.2, delay = 0, filterFreq = 1200, filterType = 'lowpass', Q }) {
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const start = ctx.currentTime + delay;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;
    // A bandpass filter with a raised Q rings around its center frequency
    // instead of just rolling off — that resonant ring is what reads as
    // "hollow" (like a boom inside a shell) rather than a flat rumble.
    if (Q !== undefined) filter.Q.value = Q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    noise.connect(filter).connect(g).connect(ctx.destination);
    noise.start(start);
    noise.stop(start + duration + 0.02);
  }

  const sfx = {
    swap() {
      playTone({ freq: 380, freqEnd: 520, duration: 0.09, type: 'sine', gain: 0.1 });
    },
    match(chain) {
      playTone({ freq: 500 + Math.min(chain, 6) * 50, freqEnd: 800, duration: 0.16, type: 'triangle', gain: 0.15 });
    },
    // Creation sounds — distinct per special type, evoking the ability it grants.
    createBomb() {
      // An electric zap crackle igniting into a warm flame whoosh, as if the
      // gem just caught fire.
      playNoise({ duration: 0.06, gain: 0.2, filterFreq: 8500 });
      playTone({ freq: 1700, freqEnd: 300, duration: 0.08, type: 'square', gain: 0.13 });
      playNoise({ duration: 0.28, gain: 0.18, filterFreq: 1100, delay: 0.06 });
      playTone({ freq: 180, freqEnd: 420, duration: 0.22, type: 'sawtooth', gain: 0.1, delay: 0.08 });
      playNoise({ duration: 0.05, gain: 0.09, filterFreq: 4800, delay: 0.16 });
    },
    createCross() {
      // A quick rising three-note chime, like the gem is charging up with energy.
      playTone({ freq: 500, freqEnd: 900, duration: 0.12, type: 'triangle', gain: 0.12 });
      playTone({ freq: 750, freqEnd: 1500, duration: 0.14, type: 'triangle', gain: 0.1, delay: 0.07 });
      playTone({ freq: 1100, freqEnd: 2000, duration: 0.18, type: 'sine', gain: 0.08, delay: 0.14 });
      playNoise({ duration: 0.15, gain: 0.06, filterFreq: 4000, delay: 0.03 });
    },
    createWildcard() {
      // A laser charge-up sweep detonating into a deep atomic pulse, with a
      // shimmering electronic arpeggio riding on top — powerful and
      // otherworldly rather than a simple chime.
      playTone({ freq: 200, freqEnd: 3400, duration: 0.2, type: 'sawtooth', gain: 0.15 });
      playTone({ freq: 60, freqEnd: 20, duration: 0.5, type: 'sine', gain: 0.3, delay: 0.18 });
      playNoise({ duration: 0.4, gain: 0.12, filterFreq: 3000, filterType: 'bandpass', Q: 4, delay: 0.18 });
      playTone({ freq: 1200, freqEnd: 2400, duration: 0.12, type: 'square', gain: 0.08, delay: 0.24 });
      playTone({ freq: 1800, freqEnd: 3000, duration: 0.1, type: 'square', gain: 0.07, delay: 0.32 });
      playTone({ freq: 2600, freqEnd: 3800, duration: 0.09, type: 'square', gain: 0.06, delay: 0.4 });
    },
    // Trigger/detonation sounds — played when a special gem's ability fires.
    bomb() {
      // A crisp sharp crack, a punchy explosive sub-bass hit, and a hollow
      // resonant boom (bandpass-filtered noise ringing at a low center
      // frequency, like a blast inside a shell) instead of a flat rumble.
      playNoise({ duration: 0.04, gain: 0.3, filterFreq: 9000, filterType: 'highpass' });
      playTone({ freq: 2400, freqEnd: 500, duration: 0.06, type: 'square', gain: 0.15 });
      playTone({ freq: 95, freqEnd: 28, duration: 0.16, type: 'sine', gain: 0.34, delay: 0.015 });
      playNoise({ duration: 0.32, gain: 0.28, filterFreq: 420, filterType: 'bandpass', Q: 2.6, delay: 0.02 });
      playNoise({ duration: 0.14, gain: 0.14, filterFreq: 5800, delay: 0.08 });
    },
    cross() {
      // Electric arc: a few rapid stepped-pitch flickers plus a sharp crackle,
      // followed by a low thunder rumble tail.
      playTone({ freq: 1800, freqEnd: 400, duration: 0.05, type: 'square', gain: 0.14 });
      playTone({ freq: 2600, freqEnd: 600, duration: 0.04, type: 'square', gain: 0.12, delay: 0.05 });
      playTone({ freq: 2000, freqEnd: 300, duration: 0.06, type: 'square', gain: 0.13, delay: 0.1 });
      playNoise({ duration: 0.12, gain: 0.22, filterFreq: 7000 });
      playNoise({ duration: 0.35, gain: 0.18, filterFreq: 900, delay: 0.08 });
      playTone({ freq: 90, freqEnd: 40, duration: 0.35, type: 'sine', gain: 0.15, delay: 0.1 });
    },
    wildcardZap() {
      // A rapid laser sweep descending into a nuclear sub-bass detonation
      // with a resonant shockwave ring, then a buzzing electronic arpeggio
      // ripples outward — lasery, nuclear, and electronic all at once.
      playTone({ freq: 3200, freqEnd: 400, duration: 0.14, type: 'sawtooth', gain: 0.17 });
      playTone({ freq: 45, freqEnd: 18, duration: 0.55, type: 'sine', gain: 0.32, delay: 0.05 });
      playNoise({ duration: 0.45, gain: 0.16, filterFreq: 2400, filterType: 'bandpass', Q: 5, delay: 0.06 });
      playTone({ freq: 900, freqEnd: 1800, duration: 0.08, type: 'square', gain: 0.1, delay: 0.15 });
      playTone({ freq: 1500, freqEnd: 2600, duration: 0.07, type: 'square', gain: 0.09, delay: 0.22 });
      playTone({ freq: 2100, freqEnd: 3200, duration: 0.06, type: 'square', gain: 0.08, delay: 0.29 });
      playTone({ freq: 2700, freqEnd: 3800, duration: 0.06, type: 'square', gain: 0.07, delay: 0.36 });
    },
    // Two bombs swapped directly together: a bigger, deeper double explosion
    // than either bomb alone.
    bombCombo() {
      playNoise({ duration: 0.05, gain: 0.32, filterFreq: 9000, filterType: 'highpass' });
      playTone({ freq: 2600, freqEnd: 400, duration: 0.08, type: 'square', gain: 0.18 });
      playTone({ freq: 70, freqEnd: 22, duration: 0.3, type: 'sine', gain: 0.4 });
      playNoise({ duration: 0.5, gain: 0.32, filterFreq: 320, filterType: 'bandpass', Q: 2.2, delay: 0.03 });
      playTone({ freq: 60, freqEnd: 18, duration: 0.4, type: 'sine', gain: 0.3, delay: 0.12 });
      playNoise({ duration: 0.4, gain: 0.24, filterFreq: 260, filterType: 'bandpass', Q: 2, delay: 0.14 });
      playNoise({ duration: 0.16, gain: 0.16, filterFreq: 5500, delay: 0.1 });
    },
    // Two crosses swapped directly together: a bigger, denser electric storm
    // — overlapping arcs and a heavier thunder crack than a single cross.
    crossCombo() {
      playTone({ freq: 2200, freqEnd: 350, duration: 0.05, type: 'square', gain: 0.16 });
      playTone({ freq: 2800, freqEnd: 500, duration: 0.04, type: 'square', gain: 0.14, delay: 0.04 });
      playTone({ freq: 1600, freqEnd: 250, duration: 0.06, type: 'square', gain: 0.15, delay: 0.09 });
      playTone({ freq: 2400, freqEnd: 400, duration: 0.05, type: 'square', gain: 0.13, delay: 0.14 });
      playNoise({ duration: 0.15, gain: 0.26, filterFreq: 7500 });
      playNoise({ duration: 0.5, gain: 0.24, filterFreq: 700, delay: 0.1 });
      playTone({ freq: 70, freqEnd: 30, duration: 0.45, type: 'sine', gain: 0.2, delay: 0.12 });
    },
    // A cross swapped with a bomb: an electric arc crackle blending into an
    // explosive flame crackle -- a genuine hybrid of both sounds.
    hybridCombo() {
      playTone({ freq: 2000, freqEnd: 350, duration: 0.05, type: 'square', gain: 0.15 });
      playTone({ freq: 2600, freqEnd: 500, duration: 0.04, type: 'square', gain: 0.12, delay: 0.05 });
      playNoise({ duration: 0.1, gain: 0.22, filterFreq: 7500 });
      playNoise({ duration: 0.06, gain: 0.26, filterFreq: 9000, filterType: 'highpass', delay: 0.12 });
      playTone({ freq: 100, freqEnd: 30, duration: 0.32, type: 'sine', gain: 0.3, delay: 0.13 });
      playNoise({ duration: 0.4, gain: 0.26, filterFreq: 380, filterType: 'bandpass', Q: 2.4, delay: 0.15 });
    },
    reshuffle() {
      playTone({ freq: 260, freqEnd: 340, duration: 0.22, type: 'sine', gain: 0.1 });
    },
  };

  // ---- pure matching helpers (operate on plain 2D arrays of gem indices) ----

  // Returns both the flattened set of matched cells and the individual runs
  // (needed to tell 4-in-a-row runs apart so they can spawn a special gem).
  function findMatchesDetailed(g) {
    const runs = [];

    for (let r = 0; r < SIZE; r++) {
      let runStart = 0;
      for (let c = 1; c <= SIZE; c++) {
        const same = c < SIZE && g[r][c] !== null && g[r][c] === g[r][runStart];
        if (!same) {
          if (c - runStart >= 3) {
            const run = [];
            for (let k = runStart; k < c; k++) run.push({ r, c: k });
            runs.push(run);
          }
          runStart = c;
        }
      }
    }

    for (let c = 0; c < SIZE; c++) {
      let runStart = 0;
      for (let r = 1; r <= SIZE; r++) {
        const same = r < SIZE && g[r][c] !== null && g[r][c] === g[runStart][c];
        if (!same) {
          if (r - runStart >= 3) {
            const run = [];
            for (let k = runStart; k < r; k++) run.push({ r: k, c });
            runs.push(run);
          }
          runStart = r;
        }
      }
    }

    const cellSet = new Set();
    for (const run of runs) {
      for (const cell of run) cellSet.add(`${cell.r},${cell.c}`);
    }
    const cells = [...cellSet].map(key => {
      const [r, c] = key.split(',').map(Number);
      return { r, c };
    });

    return { cells, runs };
  }

  function findMatches(g) {
    return findMatchesDetailed(g).cells;
  }

  // Detects intersecting horizontal+vertical runs (L, T, or + shapes) whose
  // combined size is 5 or more — these spawn a cross gem instead of two
  // separate line specials.
  function findCrossGroups(runs) {
    const horizontals = runs.filter(run => run.length >= 3 && run[0].r === run[run.length - 1].r);
    const verticals = runs.filter(run => run.length >= 3 && run[0].c === run[run.length - 1].c);
    const groups = [];
    for (const hRun of horizontals) {
      const hRow = hRun[0].r;
      for (const vRun of verticals) {
        const vCol = vRun[0].c;
        const intersects = hRun.some(cell => cell.c === vCol) && vRun.some(cell => cell.r === hRow);
        if (!intersects) continue;
        if (hRun.length + vRun.length - 1 < 5) continue;
        groups.push({ hRun, vRun, intersection: { r: hRow, c: vCol } });
      }
    }
    return groups;
  }

  // A 2x2 block of the same color is its own match shape (not reducible to a
  // 3+ line run) — it spawns a bomb gem, same as a 4-in-a-row run.
  function find2x2Blocks(g) {
    const blocks = [];
    for (let r = 0; r < SIZE - 1; r++) {
      for (let c = 0; c < SIZE - 1; c++) {
        const v = g[r][c];
        if (v === null) continue;
        if (g[r][c + 1] === v && g[r + 1][c] === v && g[r + 1][c + 1] === v) {
          blocks.push([{ r, c }, { r, c: c + 1 }, { r: r + 1, c }, { r: r + 1, c: c + 1 }]);
        }
      }
    }
    return blocks;
  }

  function dedupeCells(cells) {
    const seen = new Set();
    const result = [];
    for (const cell of cells) {
      const key = cellKey(cell.r, cell.c);
      if (seen.has(key)) continue;
      seen.add(key);
      result.push(cell);
    }
    return result;
  }

  function hasPossibleMove(g) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r][c + 1];
          clone[r][c + 1] = tmp;
          if (findMatches(clone).length > 0 || find2x2Blocks(clone).length > 0) return true;
        }
        if (r < SIZE - 1) {
          const clone = g.map(row => row.slice());
          const tmp = clone[r][c];
          clone[r][c] = clone[r + 1][c];
          clone[r + 1][c] = tmp;
          if (findMatches(clone).length > 0 || find2x2Blocks(clone).length > 0) return true;
        }
      }
    }
    return false;
  }

  function genLayout() {
    let g;
    do {
      g = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          let gem;
          do {
            gem = randomGem();
          } while (
            (c >= 2 && row[c - 1] === gem && row[c - 2] === gem) ||
            (r >= 2 && g[r - 1][c] === gem && g[r - 2][c] === gem)
          );
          row.push(gem);
        }
        g.push(row);
      }
    } while (findMatches(g).length === 0 && !hasPossibleMove(g));
    return g;
  }

  function snapshotGrid() {
    return grid.map(row => row.map(t => (t ? t.gem : null)));
  }

  // ---- tile objects + animated positioning ----

  function setPos(tile, r, c, instant) {
    tile.r = r;
    tile.c = c;
    const x = c * CELL;
    const y = r * CELL;
    if (instant) tile.el.style.transition = 'none';
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(${tile.scale})`;
    if (instant) {
      tile.el.offsetHeight;
      tile.el.style.transition = '';
    }
  }

  function setScale(tile, scale) {
    tile.scale = scale;
    const x = tile.c * CELL;
    const y = tile.r * CELL;
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    tile.el.style.opacity = String(scale);
  }

  function createTile(r, c, gem) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.textContent = GEMS[gem];
    el.addEventListener('pointerdown', onPointerDown);
    el.addEventListener('pointermove', onPointerMove);
    el.addEventListener('pointerup', onPointerUp);
    el.addEventListener('pointercancel', onPointerCancel);
    board.appendChild(el);
    const tile = { id: nextId++, gem, r, c, el, scale: 1, special: null, busy: false, animating: false };
    el._tile = tile;
    setPos(tile, r, c, true);
    return tile;
  }

  // type: 'bomb' (a 4-match run OR a 2x2 block, blasts a 3x3 area when
  // cleared), 'wildcard' (5-in-a-line, zaps every gem of a color when
  // swiped), or 'cross' (L/T/+ shaped match, clears its whole row+column when
  // cleared). Also used to re-mark an already-special tile to a different
  // type (the wildcard's color-surge upgrade) — in that case the old type's
  // class/textContent are swapped out first.
  function markSpecial(tile, type) {
    if (tile.special && tile.special !== type) tile.el.classList.remove(tile.special);
    tile.special = type;
    tile.el.classList.add('special', type);
    tile.el.textContent = type === 'wildcard' ? '🌟' : GEMS[tile.gem];
    tile.el.style.transitionDuration = '';
    tile.el.style.transform = `translate(${tile.c * CELL}px, ${tile.r * CELL}px) scale(1.4)`;
    setTimeout(() => {
      // Recompute from the tile's CURRENT position rather than reusing the
      // coordinates captured above — if gravity moved this tile in the
      // meantime (cells below it in the same column also cleared this pass),
      // using stale coordinates here would snap it back to its old row,
      // leaving its real cell looking empty even though the grid is correct.
      tile.el.style.transform = `translate(${tile.c * CELL}px, ${tile.r * CELL}px) scale(1)`;
    }, 220);
  }

  function cellCenterPx(r, c) {
    return { x: GAP + c * CELL + TILE / 2, y: GAP + r * CELL + TILE / 2 };
  }

  // Animates a matched tile flying toward the cell where a new special gem is
  // forming, shrinking and fading as it merges in. Used for every non-spawn
  // cell in a run/group that's about to become a bomb, wildcard, or cross gem.
  function convergeTile(tile, targetR, targetC) {
    const x = targetC * CELL;
    const y = targetR * CELL;
    tile.scale = 0;
    tile.el.style.transitionDuration = CONVERGE_MS + 'ms';
    tile.el.style.transitionTimingFunction = 'cubic-bezier(0.4, 0, 0.7, 1)';
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(0.15)`;
    tile.el.style.opacity = '0';
  }

  // A thin laser bolt fired from one cell's center to another's, used by the
  // wildcard's activation (both the color-zap and the color-surge upgrade)
  // to visually "target" each gem it reaches.
  function spawnLaserBeam(fromPx, toPx) {
    const dx = toPx.x - fromPx.x;
    const dy = toPx.y - fromPx.y;
    const length = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const beam = document.createElement('div');
    beam.className = 'laser-beam';
    beam.style.left = fromPx.x + 'px';
    beam.style.top = fromPx.y + 'px';
    beam.style.width = length + 'px';
    beam.style.transform = `rotate(${angle}deg)`;
    board.appendChild(beam);
    beam.addEventListener('animationend', () => beam.remove());
  }

  // Beams sweeping the full row and column a cross gem is on. thickness adds
  // extra parallel beams on each side (thickness=1 sweeps 3 rows and 3
  // columns instead of just 1) — used for the stronger cross+cross combo.
  function spawnCrossBeams(origin, thickness = 0) {
    for (let dr = -thickness; dr <= thickness; dr++) {
      const r = origin.r + dr;
      if (r < 0 || r >= SIZE) continue;
      const p = cellCenterPx(r, origin.c);
      const hBeam = document.createElement('div');
      hBeam.className = 'beam beam-h';
      hBeam.style.top = (p.y - 4) + 'px';
      hBeam.style.left = '0px';
      hBeam.style.width = boardSize + 'px';
      board.appendChild(hBeam);
      hBeam.addEventListener('animationend', () => hBeam.remove());
    }

    for (let dc = -thickness; dc <= thickness; dc++) {
      const c = origin.c + dc;
      if (c < 0 || c >= SIZE) continue;
      const p = cellCenterPx(origin.r, c);
      const vBeam = document.createElement('div');
      vBeam.className = 'beam beam-v';
      vBeam.style.left = (p.x - 4) + 'px';
      vBeam.style.top = '0px';
      vBeam.style.height = boardSize + 'px';
      board.appendChild(vBeam);
      vBeam.addEventListener('animationend', () => vBeam.remove());
    }
  }

  function spawnShockwave(cx, cy, opts) {
    const wave = document.createElement('div');
    const variant = opts.variant || (opts.rainbow ? 'rainbow' : '');
    wave.className = 'shockwave' + (variant ? ' ' + variant : '');
    const size = opts.size;
    wave.style.left = cx + 'px';
    wave.style.top = cy + 'px';
    wave.style.width = size + 'px';
    wave.style.height = size + 'px';
    wave.style.marginLeft = (-size / 2) + 'px';
    wave.style.marginTop = (-size / 2) + 'px';
    wave.style.animationDuration = (opts.durationMs || 550) + 'ms';
    board.appendChild(wave);
    wave.addEventListener('animationend', () => wave.remove());
  }

  // Shatters a tile outward with a random fling + spin, used for bomb-blast cells.
  function explodeTile(tile) {
    const baseX = tile.c * CELL;
    const baseY = tile.r * CELL;
    const flingX = (Math.random() * 2 - 1) * 26;
    const flingY = (Math.random() * 2 - 1) * 26;
    const rot = (Math.random() * 2 - 1) * 100;
    tile.el.style.transition = `transform ${EXPLODE_MS}ms cubic-bezier(0.2, 0.8, 0.3, 1), opacity ${EXPLODE_MS}ms ease`;
    tile.el.style.transform = `translate(${baseX + flingX}px, ${baseY + flingY}px) scale(0) rotate(${rot}deg)`;
    tile.el.style.opacity = '0';
  }

  // Expands a set of "r,c" cell keys to include the blast radius of any special
  // gem caught inside it — a 3x3 area for a bomb, the full row+column for a
  // wildcard — chaining into further specials the blast reaches. This is what
  // lets a raw special gem incidentally swept up inside a bigger match trigger
  // its own effect even while another cell in that same run survives as the
  // new special being created. skipIds lets a caller (e.g. a direct
  // special+special swap combo) mark tiles it has already handled itself so
  // they aren't redundantly re-triggered here.
  //
  // pendingSpecials (cellKey -> type) covers cells that are ABOUT TO become a
  // new special gem this same resolveMatches pass — tile.special isn't set on
  // them yet (markSpecial only runs later, once the converge animation
  // finishes), so without this they'd look like plain matched cells to a
  // blast reaching them. reached tracks every cell a blast has hit for
  // scanning purposes, while toClear only accumulates cells that should
  // actually be removed from the grid: a pending-special cell is scanned (so
  // it still chain-triggers its own ability) but deliberately kept OUT of
  // toClear, so it survives to become the special instead of vanishing.
  //
  // Each origin also records `wave` (how many blast-hops it took to discover
  // it — 0 for a special that was directly in the initial toClear, 1 for one
  // only reached by another special's blast, etc.) and `cells` (the set of
  // cell keys ITS OWN ability reached, as opposed to the flat merged
  // blastCells). Callers use `wave` to sequence effects — an initial special
  // should visibly finish before a special its blast catches fires its own —
  // and `cells` to give a wildcard's own target cells their distinctive
  // laser-zap treatment instead of a generic blast.
  function expandSpecialChain(toClear, skipIds, pendingSpecials) {
    const pending = pendingSpecials || new Map();
    const bombOrigins = [];
    const crossOrigins = [];
    const wildcardOrigins = [];
    const blastCells = new Set();
    const processedSpecials = new Set(skipIds || []);
    const reached = new Set(toClear);

    function markReached(key) {
      reached.add(key);
      if (!pending.has(key)) toClear.add(key);
    }

    let wave = 0;
    let changed = true;
    while (changed) {
      changed = false;
      for (const key of [...reached]) {
        const { r, c } = parseCellKey(key);
        const tile = grid[r][c];
        if (!tile || processedSpecials.has(tile.id)) continue;
        const type = tile.special || pending.get(key);
        if (!type) continue;
        processedSpecials.add(tile.id);
        blastCells.add(key);
        changed = true;
        const ownCells = new Set();

        if (type === 'bomb') {
          const radius = 1;
          bombOrigins.push({ r, c, wave, cells: ownCells });
          for (let dr = -radius; dr <= radius; dr++) {
            for (let dc = -radius; dc <= radius; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr;
              const nc = c + dc;
              if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
              const nKey = cellKey(nr, nc);
              markReached(nKey);
              blastCells.add(nKey);
              ownCells.add(nKey);
            }
          }
        } else if (type === 'cross') {
          crossOrigins.push({ r, c, wave, cells: ownCells });
          for (let cc = 0; cc < SIZE; cc++) {
            const nKey = cellKey(r, cc);
            markReached(nKey);
            blastCells.add(nKey);
            ownCells.add(nKey);
          }
          for (let rr = 0; rr < SIZE; rr++) {
            const nKey = cellKey(rr, c);
            markReached(nKey);
            blastCells.add(nKey);
            ownCells.add(nKey);
          }
        } else if (type === 'wildcard') {
          wildcardOrigins.push({ r, c, wave, cells: ownCells });
          const targetColor = tile.gem;
          for (let rr = 0; rr < SIZE; rr++) {
            for (let cc = 0; cc < SIZE; cc++) {
              const t = grid[rr][cc];
              if (!t || t.gem !== targetColor) continue;
              const nKey = cellKey(rr, cc);
              markReached(nKey);
              blastCells.add(nKey);
              ownCells.add(nKey);
            }
          }
        }
      }
      wave++;
    }
    return { bombOrigins, crossOrigins, wildcardOrigins, blastCells, processedSpecials };
  }

  // Renders a chain reaction's clearing of `removed` tiles: each origin's own
  // visual (shockwave/beams) fires staggered by its `wave` (CHAIN_STAGGER_MS
  // apart) so an initial special's effect visibly plays out before a special
  // its blast catches fires its own, instead of everything happening at once.
  // A wildcard origin also draws a laser bolt to each of its own target
  // cells — the same "zapping" look its direct-swipe activation has — instead
  // of those cells just vanishing like a generic blast. Returns the largest
  // delay (ms) scheduled, so the caller knows how long to wait before moving on.
  function renderChainClear(removed, blastCells, convergeTarget, origins) {
    const { bombOrigins, crossOrigins, wildcardOrigins } = origins;
    const cellDelay = new Map();
    const laserSource = new Map();

    function claim(key, delay, source) {
      const existing = cellDelay.get(key);
      if (existing !== undefined && existing <= delay) return;
      cellDelay.set(key, delay);
      if (source) laserSource.set(key, source);
      else laserSource.delete(key);
    }

    for (const origin of bombOrigins) {
      const d = origin.wave * CHAIN_STAGGER_MS;
      claim(cellKey(origin.r, origin.c), d);
      for (const key of origin.cells) claim(key, d);
      const p = cellCenterPx(origin.r, origin.c);
      setTimeout(() => spawnShockwave(p.x, p.y, { size: CELL * 3.2, durationMs: 550 }), d);
    }
    for (const origin of crossOrigins) {
      const d = origin.wave * CHAIN_STAGGER_MS;
      claim(cellKey(origin.r, origin.c), d);
      for (const key of origin.cells) claim(key, d);
      setTimeout(() => spawnCrossBeams(origin), d);
    }
    for (const origin of wildcardOrigins) {
      const d = origin.wave * CHAIN_STAGGER_MS;
      claim(cellKey(origin.r, origin.c), d);
      const p = cellCenterPx(origin.r, origin.c);
      setTimeout(() => spawnShockwave(p.x, p.y, { size: SIZE * CELL * 1.1, rainbow: true, durationMs: 600 }), d);
      for (const key of origin.cells) {
        const { r: tr, c: tc } = parseCellKey(key);
        const dist = Math.hypot(tr - origin.r, tc - origin.c);
        claim(key, d + dist * WILDCARD_STAGGER_MS, { r: origin.r, c: origin.c });
      }
    }

    let maxDelay = 0;
    for (const tile of removed) {
      const key = cellKey(tile.r, tile.c);
      const delay = cellDelay.has(key) ? cellDelay.get(key) : 0;
      maxDelay = Math.max(maxDelay, delay);
      const source = laserSource.get(key);
      setTimeout(() => {
        if (source) {
          spawnLaserBeam(cellCenterPx(source.r, source.c), cellCenterPx(tile.r, tile.c));
          tile.el.classList.add('zapped');
        }
        if (blastCells.has(key)) {
          explodeTile(tile);
        } else if (convergeTarget.has(key)) {
          const target = convergeTarget.get(key);
          convergeTile(tile, target.r, target.c);
        } else {
          setScale(tile, 0);
        }
      }, delay);
    }
    return maxDelay;
  }

  // A bomb-style blast area of the given radius centered on (r,c). Used both
  // for a plain bomb (radius 1) and the bigger radius two bombs combine into
  // (see triggerSpecialCombo).
  function bombAreaCells(r, c, radius) {
    const cells = new Set();
    for (let dr = -radius; dr <= radius; dr++) {
      for (let dc = -radius; dc <= radius; dc++) {
        const nr = r + dr;
        const nc = c + dc;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
        cells.add(cellKey(nr, nc));
      }
    }
    return cells;
  }

  // A cross-style row+column clear through (r,c). thickness adds extra
  // parallel rows/columns on each side (thickness=1 clears 3 rows and 3
  // columns instead of just 1) — used for the stronger cross+cross combo.
  function crossLineCells(r, c, thickness) {
    const cells = new Set();
    for (let dr = -thickness; dr <= thickness; dr++) {
      const rr = r + dr;
      if (rr < 0 || rr >= SIZE) continue;
      for (let cc = 0; cc < SIZE; cc++) cells.add(cellKey(rr, cc));
    }
    for (let dc = -thickness; dc <= thickness; dc++) {
      const cc = c + dc;
      if (cc < 0 || cc >= SIZE) continue;
      for (let rr = 0; rr < SIZE; rr++) cells.add(cellKey(rr, cc));
    }
    return cells;
  }

  function clearBoard() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) grid[r][c] = null;
    }
    board.innerHTML = '';
  }

  function buildBoardFromLayout(layout) {
    clearBoard();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        grid[r][c] = createTile(r, c, layout[r][c]);
      }
    }
  }

  // ---- selection + input (click/tap and swipe/drag share attemptSwap) ----

  function selectTile(r, c) {
    selected = { r, c };
    grid[r][c].el.classList.add('selected');
  }

  function clearSelection() {
    if (selected) {
      const t = grid[selected.r][selected.c];
      if (t) t.el.classList.remove('selected');
    }
    selected = null;
  }

  function handleTap(r, c) {
    const tapped = grid[r][c];
    if (!tapped || tapped.busy) return;
    if (!selected) {
      selectTile(r, c);
      return;
    }
    if (selected.r === r && selected.c === c) {
      clearSelection();
      return;
    }
    const isAdjacent =
      (Math.abs(selected.r - r) === 1 && selected.c === c) ||
      (Math.abs(selected.c - c) === 1 && selected.r === r);
    if (!isAdjacent) {
      clearSelection();
      selectTile(r, c);
      return;
    }
    const from = selected;
    clearSelection();
    attemptSwap(from, { r, c });
  }

  function onPointerDown(e) {
    if (soundEnabled) getAudioCtx(); // unlock audio on the earliest possible gesture
    const tile = e.currentTarget._tile;
    if (tile.busy) return;
    // Keyed by pointerId so multiple fingers (or overlapping gestures) can each
    // be mid-swipe at the same time without clobbering each other's tracking.
    pointerStates.set(e.pointerId, {
      r: tile.r,
      c: tile.c,
      startX: e.clientX,
      startY: e.clientY,
      moved: false,
    });
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {
      // pointer may no longer be active (rapid tap/touch edge cases) — safe to ignore
    }
  }

  function onPointerMove(e) {
    const state = pointerStates.get(e.pointerId);
    if (!state || state.moved) return;
    const dx = e.clientX - state.startX;
    const dy = e.clientY - state.startY;
    if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;

    state.moved = true;
    let targetR = state.r;
    let targetC = state.c;
    if (Math.abs(dx) > Math.abs(dy)) {
      targetC += dx > 0 ? 1 : -1;
    } else {
      targetR += dy > 0 ? 1 : -1;
    }

    const from = { r: state.r, c: state.c };
    clearSelection();
    if (targetR >= 0 && targetR < SIZE && targetC >= 0 && targetC < SIZE) {
      attemptSwap(from, { r: targetR, c: targetC });
    }
  }

  function onPointerUp(e) {
    const state = pointerStates.get(e.pointerId);
    pointerStates.delete(e.pointerId);
    if (!state) return;
    if (!state.moved) handleTap(state.r, state.c);
  }

  function onPointerCancel(e) {
    pointerStates.delete(e.pointerId);
  }

  // ---- swap / match / gravity ----

  // The swap animation gets an explicit duration (tied to the adjustable
  // SWAP_MS) instead of the CSS default, so the slider only affects swaps —
  // gravity falls and match fades keep their own fixed timing. Callers reset
  // transitionDuration back to '' once the swap-specific animation is done.
  function doSwap(a, b, opts = {}) {
    const tileA = grid[a.r][a.c];
    const tileB = grid[b.r][b.c];
    grid[a.r][a.c] = tileB;
    grid[b.r][b.c] = tileA;
    tileA.el.style.transitionDuration = SWAP_MS + 'ms';
    tileB.el.style.transitionDuration = SWAP_MS + 'ms';
    setPos(tileB, a.r, a.c);
    setPos(tileA, b.r, b.c);
    if (!opts.silent) sfx.swap();
  }

  function flashInvalid(elA, elB) {
    elA.classList.add('invalid');
    elB.classList.add('invalid');
    setTimeout(() => {
      elA.classList.remove('invalid');
      elB.classList.remove('invalid');
    }, 300);
  }

  function cellKey(r, c) {
    return `${r},${c}`;
  }

  function parseCellKey(key) {
    const [r, c] = key.split(',').map(Number);
    return { r, c };
  }

  // True if cell is part of a line-run match OR a 2x2 same-color quad block —
  // the two independent match shapes the game recognizes.
  function cellInMatches(g, cell) {
    if (findMatches(g).some(m => m.r === cell.r && m.c === cell.c)) return true;
    return find2x2Blocks(g).some(block => block.some(c => c.r === cell.r && c.c === cell.c));
  }

  function cellIsMatched(cell) {
    return cellInMatches(snapshotGrid(), cell);
  }

  // Would swapping a and b back to their pre-swap positions complete a match
  // right now? Used to detect the "return" half of the quick-swap trick (the
  // sacrificial gem only completes the line once it reverts) without having
  // to actually perform the swap first.
  function wouldMatchAfterRevert(a, b) {
    const g = snapshotGrid();
    const tmp = g[a.r][a.c];
    g[a.r][a.c] = g[b.r][b.c];
    g[b.r][b.c] = tmp;
    return cellInMatches(g, a) || cellInMatches(g, b);
  }

  // The run(s) of 3+ currently passing through a cell.
  function matchRunsAt(cell) {
    const { runs } = findMatchesDetailed(snapshotGrid());
    return runs.filter(run => run.some(c => c.r === cell.r && c.c === cell.c));
  }

  // A match formed by the "quick swap" assist trick can involve OTHER tiles
  // that are still visibly sliding into place themselves (an assist gem's own
  // swap animation still in flight). Wait for all of them to finish animating
  // before the match is allowed to combine — otherwise the clear/converge
  // animation can start while an assist gem is still visibly moving.
  //
  // This deliberately checks tile.animating (true only for the ~SWAP_MS of an
  // actual position change), not tile.busy (true for an assist's whole
  // decide-phase, including its own grace-period wait). Several swipes can be
  // racing to resolve the very same match at once, each waiting on the
  // others — gating on the full decide-phase would have them wait on each
  // other's grace periods too, adding real delay for no visual benefit once
  // everything has actually stopped moving. a/b are excluded since this
  // swap's own animation is already accounted for by the caller.
  async function waitForOtherTilesToSettle(a, b) {
    const isAOrB = cell => (cell.r === a.r && cell.c === a.c) || (cell.r === b.r && cell.c === b.c);
    let waited = 0;
    // Capped by the longest a swap animation could legitimately run (the
    // slider's max), not GRACE_MS — that's a different, much longer window
    // and would time out too early for a slow swap-speed setting.
    while (waited < SWAP_MS_MAX + 300) {
      const runs = [...matchRunsAt(a), ...matchRunsAt(b)];
      const stillAnimating = runs.some(run => run.some(cell => {
        if (isAOrB(cell)) return false;
        const t = grid[cell.r][cell.c];
        return t && t.animating;
      }));
      if (!stillAnimating) return;
      await sleep(GRACE_POLL_MS);
      waited += GRACE_POLL_MS;
    }
  }

  // Queues the actual clear+gravity resolution so concurrent swaps (which are
  // otherwise fully independent) never mutate the shared grid at the same time.
  function enqueueResolution(taskFn) {
    resolveQueue.push(taskFn);
    drainResolveQueue();
  }

  async function drainResolveQueue() {
    if (resolveQueueBusy) return;
    resolveQueueBusy = true;
    while (resolveQueue.length > 0) {
      const task = resolveQueue.shift();
      await task();
    }
    resolveQueueBusy = false;
  }

  // Polls during the grace window for either way the quick-swap trick can pay
  // off: a match appearing in the current (swapped) position, or — the
  // "return" variant — a match that would appear the instant this swap
  // reverts. Catching the latter as soon as it's true (rather than only after
  // the full grace window elapses) is what lets the swap revert and combine
  // right away once the assist gems are in place, instead of always waiting
  // out the rest of the grace period first.
  async function waitForGraceOutcome(a, b) {
    if (cellIsMatched(a) || cellIsMatched(b)) return 'matched';
    let elapsed = 0;
    while (elapsed < GRACE_MS) {
      if (wouldMatchAfterRevert(a, b)) return 'revert';
      await sleep(GRACE_POLL_MS);
      elapsed += GRACE_POLL_MS;
      if (cellIsMatched(a) || cellIsMatched(b)) return 'matched';
    }
    return 'none';
  }

  // Only the two tiles being swapped are locked (tile.busy) — every other tile
  // on the board stays fully interactive, so several swipes can be in flight
  // at once. A swap that doesn't immediately match isn't reverted right away:
  // it hangs for a grace window, and even after reverting we check once more.
  // That's what enables the classic "quick swap" assist trick — moving other
  // same-color gems into the line while this swap is away completes the match
  // either while it's swapped out, or the instant it returns home.
  async function attemptSwap(a, b) {
    const tileA = grid[a.r][a.c];
    const tileB = grid[b.r][b.c];
    if (!tileA || !tileB || tileA.busy || tileB.busy) return;

    tileA.busy = true;
    tileB.busy = true;
    tileA.animating = true;
    tileB.animating = true;
    const elA = tileA.el;
    const elB = tileB.el;
    elA.classList.add('pending');
    elB.classList.add('pending');
    doSwap(a, b);
    await sleep(SWAP_MS);
    tileA.animating = false;
    tileB.animating = false;
    elA.style.transitionDuration = '';
    elB.style.transitionDuration = '';

    // Swapping two special gems directly into each other combines both their
    // abilities into one bigger effect, instead of just triggering one of
    // them — EXCEPT when exactly one of the two is a wildcard, which instead
    // falls through to the wildcard-activation branch below: swapping a
    // special gem into a wildcard promotes every gem of that color to the
    // swapped-in gem's special grade (see triggerWildcardUpgrade), a more
    // specific interaction than the generic combo. Two wildcards together
    // still take the generic combo path (the whole-board wipe).
    const wcA = tileA.special === 'wildcard';
    const wcB = tileB.special === 'wildcard';
    const exactlyOneWildcard = (wcA || wcB) && !(wcA && wcB);
    if (tileA.special && tileB.special && !exactlyOneWildcard) {
      elA.classList.remove('pending');
      elB.classList.remove('pending');
      enqueueResolution(async () => {
        moves++;
        movesEl.textContent = moves;
        await triggerSpecialCombo(tileA, tileB);
        await resolveMatches();
      });
      tileA.busy = false;
      tileB.busy = false;
      return;
    }

    // A wildcard always activates on swipe, regardless of whether it forms a match.
    const wildcardTile = tileA.special === 'wildcard' ? tileA : (tileB.special === 'wildcard' ? tileB : null);
    if (wildcardTile) {
      const otherTile = wildcardTile === tileA ? tileB : tileA;
      elA.classList.remove('pending');
      elB.classList.remove('pending');
      enqueueResolution(async () => {
        moves++;
        movesEl.textContent = moves;
        await triggerWildcard(wildcardTile, otherTile);
        await resolveMatches();
      });
      tileA.busy = false;
      tileB.busy = false;
      return;
    }

    const outcome = await waitForGraceOutcome(a, b);
    if (outcome === 'matched') {
      // An assist gem forming part of this match may still be sliding into
      // place — let it finish before the match actually combines.
      await waitForOtherTilesToSettle(a, b);
      elA.classList.remove('pending');
      elB.classList.remove('pending');
      enqueueResolution(async () => {
        moves++;
        movesEl.textContent = moves;
        await resolveMatches({ from: a, to: b });
      });
      tileA.busy = false;
      tileB.busy = false;
      return;
    }

    // No match while swapped — revert. If we caught early that reverting
    // completes the line (the assist gems are already in place), skip the
    // invalid flash and go straight back; otherwise this really is a dead end.
    if (outcome === 'none') flashInvalid(elA, elB);
    tileA.animating = true;
    tileB.animating = true;
    if (grid[a.r][a.c] && grid[b.r][b.c]) doSwap(a, b, { silent: true });
    await sleep(SWAP_MS);
    tileA.animating = false;
    tileB.animating = false;
    elA.style.transitionDuration = '';
    elB.style.transitionDuration = '';

    if (cellIsMatched(a) || cellIsMatched(b)) {
      await waitForOtherTilesToSettle(a, b);
      enqueueResolution(async () => {
        moves++;
        movesEl.textContent = moves;
        await resolveMatches({ from: b, to: a });
      });
    }

    elA.classList.remove('pending');
    elB.classList.remove('pending');
    tileA.busy = false;
    tileB.busy = false;
  }

  // Clears every gem matching otherTile's color (plus the wildcard itself), with
  // a rainbow shockwave and a laser-zap that ripples outward from the wildcard.
  // If otherTile is itself a special gem, this instead promotes every gem of
  // that color to the same special grade (see triggerWildcardUpgrade).
  async function triggerWildcard(wildcardTile, otherTile) {
    if (otherTile.special) {
      await triggerWildcardUpgrade(wildcardTile, otherTile);
      return;
    }

    const targetColor = otherTile.gem;
    const origin = { r: wildcardTile.r, c: wildcardTile.c };

    const toClear = new Set([cellKey(origin.r, origin.c)]);
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (t && t.gem === targetColor) toClear.add(cellKey(r, c));
      }
    }

    // The origin wildcard is already being fully handled here (its own target
    // color was chosen from otherTile, not its own gem) — skip it so the
    // generic wildcard branch below doesn't also re-trigger it with its
    // default (own-color) behavior.
    const { bombOrigins, crossOrigins, wildcardOrigins, blastCells } =
      expandSpecialChain(toClear, new Set([wildcardTile.id]));

    const removed = [];
    for (const key of toClear) {
      const { r, c } = parseCellKey(key);
      const tile = grid[r][c];
      if (!tile) continue;
      removed.push(tile);
      grid[r][c] = null;
    }

    const originPx = cellCenterPx(origin.r, origin.c);
    spawnShockwave(originPx.x, originPx.y, {
      size: SIZE * CELL * 1.6,
      rainbow: true,
      durationMs: 700,
    });

    let maxDelay = 0;
    for (const tile of removed) {
      const isOrigin = tile.id === wildcardTile.id;
      const dist = Math.hypot(tile.r - origin.r, tile.c - origin.c);
      const delay = dist * WILDCARD_STAGGER_MS;
      maxDelay = Math.max(maxDelay, delay);
      const key = cellKey(tile.r, tile.c);
      const targetPx = cellCenterPx(tile.r, tile.c);
      setTimeout(() => {
        if (!isOrigin) spawnLaserBeam(originPx, targetPx);
        tile.el.classList.add('zapped');
        if (blastCells.has(key)) explodeTile(tile);
        else setScale(tile, 0);
      }, delay);
    }
    for (const origin2 of bombOrigins) {
      const p = cellCenterPx(origin2.r, origin2.c);
      const dist = Math.hypot(origin2.r - origin.r, origin2.c - origin.c);
      setTimeout(() => spawnShockwave(p.x, p.y, { size: CELL * 3.2, durationMs: 550 }), dist * WILDCARD_STAGGER_MS);
    }
    for (const origin2 of crossOrigins) {
      const dist = Math.hypot(origin2.r - origin.r, origin2.c - origin.c);
      setTimeout(() => spawnCrossBeams(origin2), dist * WILDCARD_STAGGER_MS);
    }
    for (const origin2 of wildcardOrigins) {
      const p = cellCenterPx(origin2.r, origin2.c);
      const dist = Math.hypot(origin2.r - origin.r, origin2.c - origin.c);
      setTimeout(() => spawnShockwave(p.x, p.y, { size: SIZE * CELL * 1.1, rainbow: true, durationMs: 600 }), dist * WILDCARD_STAGGER_MS);
    }

    const gained = removed.length * 10 + 100 + bombOrigins.length * 50 + crossOrigins.length * 80 +
      wildcardOrigins.length * 120;
    score += gained;
    scoreEl.textContent = score;
    messageEl.textContent = `Wildcard zap! +${gained}`;
    sfx.wildcardZap();
    if (bombOrigins.length > 0) sfx.bomb();
    if (crossOrigins.length > 0) sfx.cross();

    const fadeMs = (bombOrigins.length > 0 || crossOrigins.length > 0) ? EXPLODE_MS : WILDCARD_FADE_MS;
    await sleep(maxDelay + fadeMs);
    for (const tile of removed) tile.el.remove();

    applyGravityAnimated();
    await sleep(FALL_MS);
  }

  // Swapping a SPECIAL gem into the wildcard (instead of a plain color gem)
  // doesn't clear the board — it promotes every other gem of that color to
  // the same special grade, arming the whole board with that ability. The
  // wildcard itself is consumed; otherTile stays put (it's already the grade
  // everything else is being promoted to).
  async function triggerWildcardUpgrade(wildcardTile, otherTile) {
    const targetColor = otherTile.gem;
    const targetType = otherTile.special;
    const origin = { r: wildcardTile.r, c: wildcardTile.c };
    const wildcardEl = wildcardTile.el;

    grid[origin.r][origin.c] = null;

    const upgraded = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (t && t.gem === targetColor && t.special !== targetType) upgraded.push(t);
      }
    }

    const originPx = cellCenterPx(origin.r, origin.c);
    spawnShockwave(originPx.x, originPx.y, {
      size: SIZE * CELL * 1.6,
      variant: 'combo',
      durationMs: 700,
    });

    let maxDelay = 0;
    for (const tile of upgraded) {
      const dist = Math.hypot(tile.r - origin.r, tile.c - origin.c);
      const delay = dist * WILDCARD_STAGGER_MS;
      maxDelay = Math.max(maxDelay, delay);
      const targetPx = cellCenterPx(tile.r, tile.c);
      setTimeout(() => {
        spawnLaserBeam(originPx, targetPx);
        markSpecial(tile, targetType);
      }, delay);
    }

    const gained = upgraded.length * 25 + 200;
    score += gained;
    scoreEl.textContent = score;
    messageEl.textContent = `Color surge! All ${GEMS[targetColor]} became ${targetType} gems! +${gained}`;
    sfx.wildcardZap();

    await sleep(maxDelay + 300);
    wildcardEl.remove();

    applyGravityAnimated();
    await sleep(FALL_MS);
  }

  // Swapping two special gems directly into each other combines their
  // abilities into one bigger, cooler effect instead of just triggering one.
  // The effect depends on which pair swapped:
  //  - two wildcards: the ultimate combo, wiping the entire board.
  //  - two bombs: one bigger explosion (radius 3 instead of 1) at each origin.
  //  - two crosses: a thicker elimination (3 rows/columns instead of 1) at
  //    each origin.
  //  - a cross + a bomb: a genuine hybrid — each origin gets BOTH abilities
  //    (its own row+column AND a blast radius), not just each gem doing its
  //    own separate thing.
  async function triggerSpecialCombo(tileA, tileB) {
    const bothWildcard = tileA.special === 'wildcard' && tileB.special === 'wildcard';
    const bothBomb = tileA.special === 'bomb' && tileB.special === 'bomb';
    const bothCross = tileA.special === 'cross' && tileB.special === 'cross';
    // The only remaining pairing once wildcard/bomb/bomb/cross/cross are
    // ruled out is a cross swapped with a bomb.
    const originA = { r: tileA.r, c: tileA.c };
    const originB = { r: tileB.r, c: tileB.c };

    let toClear;
    if (bothWildcard) {
      toClear = new Set();
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c]) toClear.add(cellKey(r, c));
        }
      }
    } else if (bothBomb) {
      toClear = new Set([...bombAreaCells(originA.r, originA.c, 3), ...bombAreaCells(originB.r, originB.c, 3)]);
    } else if (bothCross) {
      toClear = new Set([...crossLineCells(originA.r, originA.c, 1), ...crossLineCells(originB.r, originB.c, 1)]);
    } else {
      toClear = new Set([
        ...crossLineCells(originA.r, originA.c, 0), ...bombAreaCells(originA.r, originA.c, 1),
        ...crossLineCells(originB.r, originB.c, 0), ...bombAreaCells(originB.r, originB.c, 1),
      ]);
    }

    const { bombOrigins, crossOrigins, wildcardOrigins, blastCells } =
      expandSpecialChain(toClear, new Set([tileA.id, tileB.id]));

    const removed = [];
    for (const key of toClear) {
      const { r, c } = parseCellKey(key);
      const tile = grid[r][c];
      if (!tile) continue;
      removed.push(tile);
      grid[r][c] = null;
    }

    const pxA = cellCenterPx(originA.r, originA.c);
    const pxB = cellCenterPx(originB.r, originB.c);

    if (bothWildcard) {
      // The same laser-zap look an ordinary wildcard activation has, just
      // doubled — one rainbow ring rippling out from each origin.
      spawnShockwave(pxA.x, pxA.y, { size: SIZE * CELL * 1.1, rainbow: true, durationMs: 600 });
      spawnShockwave(pxB.x, pxB.y, { size: SIZE * CELL * 1.1, rainbow: true, durationMs: 600 });
    } else if (bothBomb) {
      spawnShockwave(pxA.x, pxA.y, { size: CELL * 7.5, durationMs: 700 });
      spawnShockwave(pxB.x, pxB.y, { size: CELL * 7.5, durationMs: 700 });
    } else if (bothCross) {
      spawnCrossBeams(originA, 1);
      spawnCrossBeams(originB, 1);
    } else {
      spawnCrossBeams(originA);
      spawnCrossBeams(originB);
      spawnShockwave(pxA.x, pxA.y, { size: CELL * 3.2, durationMs: 550 });
      spawnShockwave(pxB.x, pxB.y, { size: CELL * 3.2, durationMs: 550 });
    }
    for (const origin of bombOrigins) {
      const p = cellCenterPx(origin.r, origin.c);
      spawnShockwave(p.x, p.y, { size: CELL * 3.2, durationMs: 550 });
    }
    for (const origin of crossOrigins) spawnCrossBeams(origin);
    for (const origin of wildcardOrigins) {
      const p = cellCenterPx(origin.r, origin.c);
      spawnShockwave(p.x, p.y, { size: SIZE * CELL * 1.1, rainbow: true, durationMs: 600 });
    }

    let maxDelay = 0;
    for (const tile of removed) {
      if (bothWildcard) {
        // Zap outward from whichever origin is closer, the same ripple a
        // single wildcard's own activation uses.
        const distA = Math.hypot(tile.r - originA.r, tile.c - originA.c);
        const distB = Math.hypot(tile.r - originB.r, tile.c - originB.c);
        const useA = distA <= distB;
        const delay = Math.min(distA, distB) * WILDCARD_STAGGER_MS;
        maxDelay = Math.max(maxDelay, delay);
        const isOrigin = tile.id === tileA.id || tile.id === tileB.id;
        const targetPx = cellCenterPx(tile.r, tile.c);
        setTimeout(() => {
          if (!isOrigin) spawnLaserBeam(useA ? pxA : pxB, targetPx);
          tile.el.classList.add('zapped');
          explodeTile(tile);
        }, delay);
      } else {
        tile.el.classList.add('zapped');
        explodeTile(tile);
      }
    }

    const gained = removed.length * 15 + 250;
    score += gained;
    scoreEl.textContent = score;
    let label;
    if (bothWildcard) label = 'ULTIMATE COMBO';
    else if (bothBomb) label = 'MEGA EXPLOSION';
    else if (bothCross) label = 'MEGA CROSS';
    else label = 'HYBRID BLAST';
    messageEl.textContent = `${label}! +${gained}`;

    if (bothWildcard) sfx.wildcardZap();
    else if (bothBomb) sfx.bombCombo();
    else if (bothCross) sfx.crossCombo();
    else sfx.hybridCombo();

    await sleep(maxDelay + EXPLODE_MS);
    for (const tile of removed) tile.el.remove();

    applyGravityAnimated();
    await sleep(FALL_MS);
  }

  async function resolveMatches(swapContext) {
    let chain = 0;
    let firstPass = true;
    while (true) {
      const snapshot = snapshotGrid();
      const { cells: matchedCells, runs } = findMatchesDetailed(snapshot);
      const quadBlocks = find2x2Blocks(snapshot);
      if (matchedCells.length === 0 && quadBlocks.length === 0) break;
      chain++;

      // L/T/+ shaped matches (an intersecting horizontal + vertical run, combined
      // size 5+) spawn a cross gem instead of two separate line specials. Runs of
      // 4 spawn a bomb; straight runs of 5+ spawn a wildcard. Whichever gem forms,
      // one cell of the match survives as the special instead of being cleared —
      // every other matched cell in that run/group flies in and converges into it.
      const isFree = cell => !grid[cell.r][cell.c] || !grid[cell.r][cell.c].special;
      const pickSwapPreferred = cells => firstPass && swapContext
        ? cells.find(cell =>
            isFree(cell) &&
            ((cell.r === swapContext.to.r && cell.c === swapContext.to.c) ||
              (cell.r === swapContext.from.r && cell.c === swapContext.from.c)))
        : null;

      const spawnMap = new Map();
      const convergeTarget = new Map();
      const crossGroups = findCrossGroups(runs);
      const crossClaimedRuns = new Set();
      for (const g of crossGroups) {
        crossClaimedRuns.add(g.hRun);
        crossClaimedRuns.add(g.vRun);
      }

      for (const g of crossGroups) {
        const groupCells = dedupeCells([...g.hRun, ...g.vRun]);
        const spawnCell = pickSwapPreferred(groupCells)
          || (isFree(g.intersection) ? g.intersection : null)
          || groupCells.find(isFree)
          || g.intersection;
        const spawnKey = cellKey(spawnCell.r, spawnCell.c);
        spawnMap.set(spawnKey, 'cross');
        for (const cell of groupCells) {
          const key = cellKey(cell.r, cell.c);
          if (key === spawnKey) continue;
          convergeTarget.set(key, spawnCell);
        }
      }

      for (const run of runs) {
        if (run.length < 4 || crossClaimedRuns.has(run)) continue;
        const type = run.length >= 5 ? 'wildcard' : 'bomb';
        const spawnCell = pickSwapPreferred(run) || run.find(isFree) || run[Math.floor(run.length / 2)];
        const spawnKey = cellKey(spawnCell.r, spawnCell.c);
        spawnMap.set(spawnKey, type);
        for (const cell of run) {
          const key = cellKey(cell.r, cell.c);
          if (key === spawnKey) continue;
          convergeTarget.set(key, spawnCell);
        }
      }

      // A 2x2 same-color block is a distinct match shape from line runs, but
      // spawns the same kind of gem as a 4-in-a-row run: a bomb. Independent
      // of the run-based specials above; its cells simply won't already be
      // claimed by them in the ordinary case.
      for (const block of quadBlocks) {
        const preferred = pickSwapPreferred(block);
        const spawnCell = (preferred && !spawnMap.has(cellKey(preferred.r, preferred.c)))
          ? preferred
          : block.find(cell => isFree(cell) && !spawnMap.has(cellKey(cell.r, cell.c))) || block[0];
        const spawnKey = cellKey(spawnCell.r, spawnCell.c);
        if (spawnMap.has(spawnKey)) continue;
        spawnMap.set(spawnKey, 'bomb');
        for (const cell of block) {
          const key = cellKey(cell.r, cell.c);
          if (key === spawnKey) continue;
          if (!convergeTarget.has(key)) convergeTarget.set(key, spawnCell);
        }
      }
      firstPass = false;

      const toClear = new Set(matchedCells.map(({ r, c }) => cellKey(r, c)));
      for (const block of quadBlocks) {
        for (const cell of block) toClear.add(cellKey(cell.r, cell.c));
      }
      for (const key of spawnMap.keys()) toClear.delete(key);

      // Any bomb, cross, or wildcard caught in the clear detonates its own
      // ability — a 3x3 area, the full row+column, or every gem of its color —
      // which can chain into further specials the blast reaches. This is also
      // how a raw special swept into a bigger forming match still gets to
      // trigger its own effect even as another cell in that match survives as
      // the newly created special gem. spawnMap is passed as pendingSpecials
      // so a blast reaching a cell that's about to spawn a NEW special this
      // same pass makes that special chain-trigger too instead of just
      // destroying it before it ever gets to exist.
      const { bombOrigins, crossOrigins, wildcardOrigins, blastCells } =
        expandSpecialChain(toClear, undefined, spawnMap);

      const removed = [];
      for (const key of toClear) {
        const { r, c } = parseCellKey(key);
        const tile = grid[r][c];
        if (!tile) continue;
        removed.push(tile);
        grid[r][c] = null;
      }

      // Each origin's own visual (and, for a wildcard, its laser-zap on each
      // of its own target cells) is staggered by wave — the special that
      // directly matched fires immediately, but a special its blast catches
      // (e.g. a bomb detonating into a forming 5-match wildcard) fires a beat
      // later, so its effect visibly plays out on its own instead of
      // vanishing silently or firing simultaneously with the one that caught it.
      const maxChainDelay = renderChainClear(removed, blastCells, convergeTarget,
        { bombOrigins, crossOrigins, wildcardOrigins });

      // Let the converging gems arrive before the spawn cell visibly pops into
      // its special form — always true here, since a spawning run/group always
      // has at least one other matched cell converging into it.
      for (const [key, type] of spawnMap) {
        const { r, c } = parseCellKey(key);
        const tile = grid[r][c];
        if (!tile) continue;
        setTimeout(() => markSpecial(tile, type), Math.round(CONVERGE_MS * 0.7));
      }

      const gained = toClear.size * 10 * chain + bombOrigins.length * 50 + crossOrigins.length * 80 +
        wildcardOrigins.length * 120;
      score += gained;
      scoreEl.textContent = score;
      const spawnedTypes = [...spawnMap.values()];
      const spawnedSet = new Set(spawnedTypes);
      // Trigger sounds for any raw specials caught and detonated by this clear,
      // one per distinct wave so they land in step with their staggered visuals
      // (an initial bomb's sound plays immediately; a wildcard it catches plays
      // its sound a beat later, instead of both firing at once).
      function scheduleTypeSound(origins, fn) {
        const waves = new Set(origins.map(o => o.wave));
        for (const w of waves) setTimeout(fn, w * CHAIN_STAGGER_MS);
      }
      scheduleTypeSound(bombOrigins, () => sfx.bomb());
      scheduleTypeSound(crossOrigins, () => sfx.cross());
      scheduleTypeSound(wildcardOrigins, () => sfx.wildcardZap());
      // ...plus a distinct creation sound for whichever new special gem(s) this
      // clear spawns, so a match feels tied to the ability it just granted.
      if (spawnedSet.has('bomb')) sfx.createBomb();
      if (spawnedSet.has('cross')) sfx.createCross();
      if (spawnedSet.has('wildcard')) sfx.createWildcard();
      if (spawnedTypes.length === 0 && bombOrigins.length === 0 && crossOrigins.length === 0 &&
          wildcardOrigins.length === 0) {
        sfx.match(chain);
      }
      if (crossOrigins.length > 0) {
        messageEl.textContent = `Cross blast! +${gained}`;
      } else if (bombOrigins.length > 0) {
        messageEl.textContent = `Boom! +${gained}`;
      } else if (wildcardOrigins.length > 0) {
        messageEl.textContent = `Wildcard zap! +${gained}`;
      } else if (spawnedTypes.includes('cross')) {
        messageEl.textContent = `Cross gem created! +${gained}`;
      } else if (spawnedTypes.includes('wildcard')) {
        messageEl.textContent = `Wildcard gem created! +${gained}`;
      } else if (spawnedTypes.length > 0) {
        messageEl.textContent = `Special gem created! +${gained}`;
      } else {
        messageEl.textContent = chain > 1 ? `Combo x${chain}! +${gained}` : `Match! +${gained}`;
      }

      let waitMs = MATCH_MS;
      if (convergeTarget.size > 0) waitMs = Math.max(waitMs, CONVERGE_MS);
      if (bombOrigins.length > 0 || crossOrigins.length > 0 || wildcardOrigins.length > 0) {
        waitMs = Math.max(waitMs, maxChainDelay + EXPLODE_MS);
      }
      await sleep(waitMs);
      for (const tile of removed) tile.el.remove();

      applyGravityAnimated();
      await sleep(FALL_MS);
    }

    if (chain > 0 && !hasPossibleMove(snapshotGrid())) {
      messageEl.textContent = 'No moves left — reshuffling...';
      sfx.reshuffle();
      await sleep(500);
      buildBoardFromLayout(genLayout());
    }

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('bejeweled-best', String(best));
    }

    if (chain === 0) {
      messageEl.textContent = '';
    } else {
      setTimeout(() => {
        messageEl.textContent = '';
      }, 1200);
    }
  }

  function applyGravityAnimated() {
    for (let c = 0; c < SIZE; c++) {
      const survivors = [];
      for (let r = 0; r < SIZE; r++) {
        const t = grid[r][c];
        if (t) survivors.push(t);
      }
      const missing = SIZE - survivors.length;

      for (let i = 0; i < survivors.length; i++) {
        const targetR = missing + i;
        const tile = survivors[i];
        grid[targetR][c] = tile;
        setPos(tile, targetR, c);
      }

      for (let i = 0; i < missing; i++) {
        const targetR = i;
        const startR = i - missing;
        // createTile already places the tile instantly (with a forced reflow),
        // so the starting frame is already committed — animating to its final
        // row can happen synchronously right here. This used to be deferred via
        // requestAnimationFrame, but that callback can be delayed or dropped
        // (a backgrounded tab, heavy concurrent activity from other swipes),
        // silently leaving the tile stuck off-board while the grid thinks the
        // cell is filled.
        const tile = createTile(startR, c, randomGem());
        grid[targetR][c] = tile;
        setPos(tile, targetR, c);
      }
    }
  }

  function newGame() {
    score = 0;
    moves = 0;
    selected = null;
    resolveQueue = [];
    scoreEl.textContent = '0';
    movesEl.textContent = '0';
    messageEl.textContent = '';
    buildBoardFromLayout(genLayout());
  }

  restartBtn.addEventListener('click', newGame);
  shuffleBtn.addEventListener('click', () => {
    resolveQueue = [];
    buildBoardFromLayout(genLayout());
    messageEl.textContent = 'Board shuffled!';
  });

  swapSpeedInput.addEventListener('input', () => {
    SWAP_MS = Number(swapSpeedInput.value);
    swapSpeedValue.textContent = SWAP_MS + 'ms';
  });

  muteBtn.textContent = soundEnabled ? '🔊' : '🔇';
  muteBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    muteBtn.textContent = soundEnabled ? '🔊' : '🔇';
    localStorage.setItem('bejeweled-sound', soundEnabled ? 'on' : 'off');
    if (soundEnabled) getAudioCtx();
  });

  applyTileMetrics();
  newGame();
})();
</script>
</body>
</html>
